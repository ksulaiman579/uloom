8:[
{q:"How many ahruf (modes/forms) was the Qur'an revealed in?",opts:["3","5","7","10"],ans:2,exp:"The Qur'an was revealed in 7 ahruf — confirmed by multiple authentic hadith in al-Bukhaaree and Muslim."},
{q:"In the famous 'Umar-Hishaam incident, what did both men do WRONG initially?",opts:["They recited fake verses","They each claimed the other was wrong about a correct recitation","They stopped praying","They refused to bring their dispute to the Prophet"],ans:1,exp:"'Umar grabbed Hishaam and accused him of reciting wrongly. But the Prophet confirmed BOTH recitations were correct — both were valid ahruf. Neither was wrong."},
{q:"True or False: The different ahruf were created by the Companions to suit their dialects.",opts:["True","False"],ans:1,exp:"False — the different ahruf came DIRECTLY FROM ALLAH through Jibreel. The Prophet was taught them by Jibreel and taught different ones to different Companions. Companions did not create them."},
{q:"According to the STRONGEST scholarly opinion, the 7 ahruf represent 7 what?",opts:["Arab tribes","Types/categories of variation","Different languages","Different manuscripts of the Qur'an"],ans:1,exp:"The strongest opinion (Ibn Qutaybah, al-Baaqillaanee, Ibn al-Jazaree) is that the 7 ahruf represent 7 TYPES of variation: wording, letters, word order, addition/subtraction, form, inflection, pronunciation."},
{q:"Which type of variation does 'maaliki/maliki' in al-Faatihah 1:4 represent?",opts:["Change in wording","Change in word order","Differences in letters within the Uthmaanic script","Form/structure change"],ans:2,exp:"'Maaliki' (Owner) vs 'Maliki' (King) represents Type 2: differences in letters that fit within the Uthmaanic dotless script framework. Both are valid qira'at."},
{q:"True or False: The 7 ahruf are the same as the 10 Qira'at.",opts:["True","False"],ans:1,exp:"False — the 7 ahruf are the broader category of HOW the Qur'an can be recited. The 10 Qira'at are specific authenticated recitation systems. The 10 Qira'at together express all the variations of the 7 ahruf."},
{q:"What was the PRIMARY reason multiple ahruf were given?",opts:["To create diversity in Islamic scholarship","To ease memorization and recitation for people of different dialects","To test the Companions","Because Arabic naturally has many dialects"],ans:1,exp:"The hadith is explicit: 'I have been sent to an illiterate nation...' — the ahruf were a MERCY from Allah to ease recitation for people who spoke differently. [Ubay ibn Ka'ab | at-Tirmidhee]"},
{q:"Who said: 'These seven ahruf are essentially one in meaning; they do not differ about what is permitted or forbidden'?",opts:["Imaam Ahmad","Ibn al-Jazaree","Ibn Shihaab az-Zuhree","Imaam al-Qurtubee"],ans:2,exp:"Ibn Shihaab az-Zuhree made this statement after narrating the hadith of Ibn Abbaas. The variations in ahruf never affect halaal/haraam rulings."},
{q:"True or False: According to Ibn al-Jazaree, the Uthmaanic mus-hafs contain ALL seven ahruf — not a single letter is missing.",opts:["True","False"],ans:0,exp:"True — Ibn al-Jazaree stated: 'The Uthmaanic mus-hafs contain all seven ahruf — only that which its script allows — not a single letter is missing.' The 10 Qira'at together express all seven."},
{q:"How many conclusions do we draw from the 3 hadith about the ahruf?",opts:["2","3","4","5"],ans:2,exp:"4 conclusions: (1) Ahruf are from Allah; (2) Multiple ahruf ease recitation; (3) The Prophet taught different ahruf to different Companions; (4) Each harf is complete in itself."}
],
9:[
{q:"How many conditions must be met for a Qiraa'a to be considered AUTHENTIC (Saheeh)?",opts:["1","2","3","4"],ans:2,exp:"According to Ibn al-Jazaree (d.832 AH): 3 conditions — (1) Arabic grammar, (2) Matches an Uthmaanic mus-haf, (3) Authentic mutawaatir chain to the Prophet."},
{q:"Which type of qiraa'a has an authentic chain and proper Arabic grammar BUT doesn't match the Uthmaanic script?",opts:["Saheeh","Shaadh (Irregular)","Da'eef (Weak)","Baatil (False)"],ans:1,exp:"Shaadh (Irregular) — meets the grammar and chain conditions but NOT the Uthmaanic script condition. It is NOT Qur'an but may be studied as tafseer only."},
{q:"True or False: It is permissible to pray using a Shaadh (irregular) qiraa'a.",opts:["True","False"],ans:1,exp:"False — it is HARAAM to treat Shaadh readings as Qur'an. Prayer with a Shaadh recitation is INVALID. Only the 10 authentic (Saheeh) qira'at are valid for prayer."},
{q:"Which student of Qaaree 'Aasim has the most widely-used qiraa'a today?",opts:["Shu'ba","Hafs","Warsh","Qaloon"],ans:1,exp:"Hafs ibn Sulaymaan — the stepson of 'Aasim — is the most famous. His recitation (Hafs 'an 'Aasim) is used by approximately 95% of Muslims worldwide."},
{q:"Approximately what percentage of Muslims recite Hafs 'an 'Aasim?",opts:["50%","75%","90%","95%"],ans:3,exp:"Hafs 'an 'Aasim is used by approximately 95% of the Muslim world — it is the dominant recitation globally."},
{q:"Who was the FIRST to formally select and preserve the seven (of the ten) qira'at?",opts:["Imaam ad-Daanee","Aboo Bakr ibn Mujaahid","ash-Shaatibee","Ibn al-Jazaree"],ans:1,exp:"Aboo Bakr ibn Mujaahid (d.324 AH) was the first scholar to formally select and document the seven — the basis for what later became the ten."},
{q:"Which qiraa'a is primarily used in Algeria, Morocco, and West Africa?",opts:["Hafs 'an 'Aasim","Qaloon 'an Naafi'","Warsh 'an Naafi'","ad-Dooree 'an Aboo 'Amr"],ans:2,exp:"Warsh 'an Naafi' (~3%) is used in Algeria, Morocco, parts of Tunisia, West Africa, and Sudan. Libya and Tunisia predominantly use Qaloon 'an Naafi'."},
{q:"True or False: In al-Faatihah 1:4, both 'Maaliki' (Owner) and 'Maliki' (King) are authentic qira'at.",opts:["True","False"],ans:0,exp:"True — 'Maaliki' is read by Naafi', Ibn Katheer and others; 'Maliki' is read by 'Aasim and others. Both are authentic Saheeh qira'at giving complementary meanings."},
{q:"Who added the LAST THREE qira'at (8th, 9th, 10th) to make the total ten?",opts:["ash-Shaatibee","Ibn al-Jazaree","Imaam ad-Daanee","Aboo Bakr ibn Mujaahid"],ans:1,exp:"Ibn al-Jazaree (d.832 AH) added Aboo Jaa'far, Ya'qoob, and Khalaf to make the ten. He also wrote Tayyibah an-Nushr for all ten simultaneously."},
{q:"Which Qaaree had the HIGHEST (shortest) chain — fewest links back to the Prophet?",opts:["Naafi' al-Madanee","Ibn Katheer al-Makkee","Ibn 'Aamir ash-Shaamee","'Aasim al-Koofee"],ans:2,exp:"Ibn 'Aamir ash-Shaamee (b.21 AH) — born only 21 years after the Hijrah, he studied under the Companion Aboo ad-Dardaa, giving him the fewest links between him and the Prophet."}
],
10:[
{q:"According to the STRONGEST definition, what makes a verse 'Makkee'?",opts:["It was revealed physically in Makkah","It was revealed BEFORE the Hijrah","It addresses the Quraysh","It has short verses"],ans:1,exp:"The strongest (time-based) definition: Makkee = revealed BEFORE the Hijrah, regardless of location. This covers all cases without exception."},
{q:"True or False: A verse revealed IN MAKKAH after the Hijrah (e.g., during the Farewell Pilgrimage) is classified as 'Makkee'.",opts:["True","False"],ans:1,exp:"False — it is classified as MADANEE. The time-based definition (before/after Hijrah) is strongest. The Farewell Pilgrimage was after the Hijrah, so its verses are Madanee."},
{q:"Which characteristic is specific to MAKKEE revelations?",opts:["Detailed laws of fasting and zakaah","Discussion with Jews and Christians","Presence of disjointed letters (al-muqatta'aat)","Mention of hudood punishments"],ans:2,exp:"Disjointed letters (Alif-Lam-Meem, Ha-Meem, etc.) are ALL Makkee — with only 2 exceptions: al-Baqarah and Aali-'Imraan (both Madanee)."},
{q:"Every soorah containing the word 'Kalaa' (Nay!) is classified as:",opts:["Madanee","Makkee","Disputed","From both categories"],ans:1,exp:"Every soorah with 'Kalaa' is Makkee — it appears in 15+ soorahs, all in the latter half of the Qur'an, and all are Makkee."},
{q:"True or False: Soorah al-Baqarah has disjointed letters but is classified as Madanee.",opts:["True","False"],ans:0,exp:"True — al-Baqarah begins with Alif-Lam-Meem and is Madanee. It is one of only 2 exceptions to the rule that soorahs with disjointed letters are Makkee (the other exception being Aali-'Imraan)."},
{q:"Which theme is CHARACTERISTIC of MADANEE revelations?",opts:["Stories of previous prophets and nations","Short concise verses with oaths","Call to Tawheed against idolaters","Mention of hypocrites and their plots"],ans:3,exp:"Hypocrisy was a Madeenah phenomenon — when the Muslim community became powerful, hypocrites pretended to be Muslim. ALL soorahs mentioning hypocrites are Madanee (except al-'Ankaboot)."},
{q:"How many soorahs are classified as Madanee?",opts:["12","20","28","82"],ans:1,exp:"20 soorahs are Madanee, 82 are Makkee, and 12 are disputed. The Madanee 20 include: al-Baqarah, Aali-'Imraan, an-Nisaa', al-Maa'idah, and others."},
{q:"Which soorah was the FIRST taken from Makkah to Madeenah?",opts:["Al-Faatihah","Al-Baqarah","Soorah Yoosuf","Al-Anfaal"],ans:2,exp:"Soorah Yoosuf was the first Makkee soorah carried to Madeenah, taken by 'Awf ibn 'Afraa' before the Hijrah."},
{q:"True or False: Knowing Makkee and Madanee classification helps identify which verses are abrogated.",opts:["True","False"],ans:0,exp:"True — when two verses appear to conflict, knowing which is Makkee and which is Madanee helps identify the later (Madanee) verse as the one that abrogates the earlier (Makkee) verse."},
{q:"What is the PRIMARY benefit of knowing Makkee and Madanee?",opts:["Knowing the historical timeline of battles","Essential for proper Qur'anic understanding and interpretation (tafseer)","Learning Arabic dialects","Understanding the lives of the Companions"],ans:1,exp:"The primary benefit is correct tafseer — you cannot interpret a verse properly without understanding its historical context, audience, and circumstances."}
],
11:[
{q:"What is the Arabic term for 'Causes of Revelation'?",opts:["Asbaab an-Nuzool","Asbab al-Hadith","Usool al-Fiqh","Tafseer al-Qur'an"],ans:0,exp:"Asbaab an-Nuzool (أسباب النزول) — literally 'the causes/reasons of revelation' — refers to the specific events that directly caused particular verses to be revealed."},
{q:"True or False: MOST of the Qur'an was revealed WITH specific causes of revelation.",opts:["True","False"],ans:1,exp:"False — MOST of the Qur'an was revealed WITHOUT specific asbaab an-nuzool. Allah revealed guidance proactively. Only a portion of the Qur'an has identifiable specific causes."},
{q:"True or False: Abrahah's attack on the Ka'bah IS the sabab an-nuzool for Soorah al-Feel.",opts:["True","False"],ans:1,exp:"False — Abrahah's attack occurred YEARS before revelation. A sabab an-nuzool must be an event that occurred SHORTLY before the verse was revealed. Long-past events are not asbaab an-nuzool."},
{q:"According to the KEY PRINCIPLE, what is the basis for applying a Qur'anic ruling?",opts:["The specificity of the occasion","The GENERALITY of the wording","The opinion of the majority of scholars","The historical context only"],ans:1,exp:"MAJORITY VIEW: 'The consideration for a ruling comes from the GENERALITY OF THE WORDING, not the specificity of its circumstance of revelation.' A verse revealed for one event applies to all similar situations."},
{q:"Which Companion's suggestion led to the MAQAAM IBRAHIM verse [2:125] being revealed?",opts:["Ibn Mas'ood","Zayd ibn Thaabit","'Umar ibn al-Khattaab","Aboo Bakr"],ans:2,exp:"'Umar suggested: 'O Prophet, what if we took the Station of Ibrahim as a place of prayer?' — and the verse [2:125] was revealed confirming this. This is one of 'Umar's 3 'agreements with his Lord.'"},
{q:"When two AUTHENTIC narrations exist with one being more EXPLICIT, which should be accepted?",opts:["The older one","The one with more narrators","The MORE EXPLICIT one","Both equally with reconciliation"],ans:2,exp:"Rule 2: When both narrations are authentic but one is explicit (clearly states the reason) and one is ambiguous, accept the explicit one. Example: 2:223 — Jaabir's explicit narration over Ibn 'Umar's ambiguous one."},
{q:"True or False: It is possible for the same verse to have been revealed MORE THAN ONCE.",opts:["True","False"],ans:0,exp:"True — az-Zarkashee: 'It is possible that a verse is revealed twice, to signify its importance.' Example: 9:113 was revealed in response to 3 separate incidents across different time periods."},
{q:"Who wrote the first book on Asbaab an-Nuzool?",opts:["al-Waahidee","as-Suyootee","'Alee al-Madeenee (teacher of al-Bukhaaree)","Ibn Hajr al-'Asqalaanee"],ans:2,exp:"'Alee al-Madeenee (d.234 AH) — the teacher of Imaam al-Bukhaaree — wrote the first dedicated book on asbaab an-nuzool. al-Waahidee (d.487 AH) later wrote the classic 'Asbab an-Nuzool.'"},
{q:"Which Companion had FOUR verses revealed in connection with events in his life?",opts:["'Umar ibn al-Khattaab","Aboo Bakr al-Siddeeq","Sa'd ibn Abee Waqqaas","Zayd ibn Thaabit"],ans:2,exp:"Sa'd ibn Abee Waqqaas: (1) mother's hunger strike → [31:15]; (2) first sword drawn in Islam + war booty → [8:1]; (3) illness/bequest question → bequest verse; (4) drinking habit → wine prohibition verse."},
{q:"al-Waahidee said it is NOT permitted to speak about asbaab an-nuzool except by:",opts:["Personal reasoning and ijtihad","Transmitting reports from those who witnessed the revelation","Reading the tafseer books","Using Arabic language analysis"],ans:1,exp:"al-Waahidee (d.487 AH): 'It is not permitted to speak about asbaab an-nuzool except by transmitting reports from those who witnessed the revelation and were present when it occurred.'"}
]
};

const EXTRA_QUIZZES={"1": [{"q": "'Uloom al-Qur'an is best described as:", "opts": ["A single subject on Arabic grammar", "An umbrella covering every field of Islamic knowledge that helps us understand the Qur'an", "A book written by as-Suyootee", "The science of recitation only"], "ans": 1, "exp": "The notes say it is not a single subject but an umbrella over every field that helps us understand the Qur'an. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "The notes compare 'Uloom al-Qur'an to what?", "opts": ["A toolkit", "A ladder", "A library", "A map"], "ans": 0, "exp": "It is described as a toolkit, where each tool answers a different question about the Qur'an. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "Which science answers the question 'Why were specific verses revealed?'", "opts": ["Makkee and Madanee", "al-Ahruf", "Asbaab an-Nuzool", "Gradual Revelation"], "ans": 2, "exp": "Asbaab an-Nuzool deals with why specific verses were revealed. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "A student asks: 'Are there valid different recitations of the Qur'an?' Which science deals with this?", "opts": ["al-Qira'at", "al-Wahy", "Compilation of the Qur'an", "Asbaab an-Nuzool"], "ans": 0, "exp": "al-Qira'at answers whether there are valid different recitations. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "Which science answers 'How was it revealed?'", "opts": ["Gradual Revelation", "al-Wahy (Inspiration)", "al-Ahruf", "Makkee and Madanee"], "ans": 1, "exp": "al-Wahy (Inspiration) covers how the Qur'an was revealed. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "The question 'What are the 7 modes?' belongs to which science?", "opts": ["al-Qira'at", "al-Ahruf", "Compilation of the Qur'an", "Makkee and Madanee"], "ans": 1, "exp": "al-Ahruf deals with the 7 modes. (Section: What is 'Uloom al-Qur'an?)"}, {"q": "Someone takes a ruling meant for a specific case and applies it to everyone. According to the notes, what does this show?", "opts": ["A lack of these sciences", "Correct use of al-Qira'at", "Knowledge of the Ahruf", "Strong Arabic"], "ans": 0, "exp": "Without these sciences a person can apply a specific ruling universally (or vice versa). (Section: Why Study it?)"}, {"q": "Which of these is NOT listed as a danger of reading the Qur'an without these sciences?", "opts": ["Misunderstanding a verse by ignoring its context", "Being confused by different authentic recitations", "Missing the rich layers of meaning in the text", "Forgetting what one has memorised"], "ans": 3, "exp": "The notes list misunderstanding context, misapplying rulings, confusion over recitations and missing layers of meaning; forgetting memorisation is not listed. (Section: Why Study it?)"}, {"q": "Why did the Companions practise these sciences naturally?", "opts": ["They had the books of az-Zarkashee", "They witnessed the revelations firsthand and knew the context of every verse", "The Successors taught them", "They studied under 'Alee al-Madeenee"], "ans": 1, "exp": "The Companions witnessed the revelations firsthand and knew the context of every verse. (Section: Historical Development)"}, {"q": "Which of these was among the first Successors to record explanations?", "opts": ["'Alee al-Madeenee", "Mujaahid", "Imaam az-Zarkashee", "as-Suyootee"], "ans": 1, "exp": "Mujaahid, Sa'eed ibn Jubayr and Qataadah were among the first to record explanations. (Section: Historical Development)"}, {"q": "What did the Successors (Tabi'een) begin doing?", "opts": ["Practising the sciences without records", "Documenting what they received from the Companions", "Writing al-Itqaan", "Formalising the entire discipline"], "ans": 1, "exp": "In the era of the Successors they began documenting what they received from the Companions. (Section: Historical Development)"}, {"q": "'Alee al-Madeenee was the teacher of which Imaam?", "opts": ["Imaam az-Zarkashee", "Imaam al-Bukhaaree", "as-Suyootee", "Ibn Taymiyyah"], "ans": 1, "exp": "'Alee al-Madeenee (d.234 AH) was the teacher of Imaam al-Bukhaaree. (Section: Historical Development)"}, {"q": "Which work do the notes describe as still the standard reference today?", "opts": ["al-Burhaan fi 'Uloom al-Qur'aan", "al-Itqaan fi 'Uloom al-Qur'aan", "'Alee al-Madeenee's book on Asbaab an-Nuzool", "The records of Qataadah"], "ans": 1, "exp": "as-Suyootee's comprehensive al-Itqaan is described as still the standard reference today. (Section: Historical Development)"}, {"q": "Put these in order from earliest to latest death: as-Suyootee, 'Alee al-Madeenee, az-Zarkashee.", "opts": ["az-Zarkashee, 'Alee al-Madeenee, as-Suyootee", "'Alee al-Madeenee, az-Zarkashee, as-Suyootee", "as-Suyootee, az-Zarkashee, 'Alee al-Madeenee", "'Alee al-Madeenee, as-Suyootee, az-Zarkashee"], "ans": 1, "exp": "'Alee al-Madeenee died 234 AH, az-Zarkashee 794 AH and as-Suyootee 911 AH. (Section: Historical Development)"}, {"q": "In the course table, what is the core question for the chapter on the Qira'at?", "opts": ["Why are there 7 modes?", "What are the 10 recitations?", "How was it preserved?", "How do we classify verses?"], "ans": 1, "exp": "The table gives the Qira'at's core question as 'What are the 10 recitations?' (Section: What This Course Covers)"}], "2": [{"q": "The name Al-Qur'an comes from which root?", "opts": ["nazala", "qara'a", "dhakara", "faraqa"], "ans": 1, "exp": "Al-Qur'an is from the root qara'a, to read/recite. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Roughly how many times is the name Al-Qur'an mentioned in the Qur'an itself?", "opts": ["~70", "4", "55", "140+"], "ans": 0, "exp": "The notes say Al-Qur'an is mentioned about 70 times. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Which name is linked to the verse [15:9] 'Indeed, it is We who sent down the Reminder...'?", "opts": ["Al-Furqaan", "Al-Dhikr", "Al-Kitaab", "Al-Tanzeel"], "ans": 1, "exp": "Al-Dhikr (The Reminder) is supported by [15:9]. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "The name Al-Tanzeel comes from nazala, meaning:", "opts": ["To read/recite", "To descend from higher to lower", "To distinguish truth from falsehood", "To remind"], "ans": 1, "exp": "Nazala means to descend from higher to lower. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "According to the notes, the name Al-Tanzeel is proof of what?", "opts": ["That the Qur'an was written down", "That Allah is above His creation", "That the Qur'an has 7 modes", "That it is preserved in hearts"], "ans": 1, "exp": "Its meaning of descending from higher to lower is given as proof that Allah is above His creation. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Which verse is quoted for Al-Kitaab?", "opts": ["[2:1-2]", "[25:1]", "[26:192]", "[15:9]"], "ans": 0, "exp": "[2:1-2] 'This is the Book, there is no doubt in it...' is cited for Al-Kitaab. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Which name is the criterion that distinguishes tawheed from shirk?", "opts": ["Al-Dhikr", "Al-Furqaan", "Al-Tanzeel", "Al-Qur'an"], "ans": 1, "exp": "Al-Furqaan distinguishes truth from falsehood, good from evil, tawheed from shirk. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Imaam az-Zarkashee lists 50+ names for the Qur'an. What do scholars clarify about them?", "opts": ["All are independent names", "Most are descriptions and attributes, not actual independent names", "Only the 5 primary names are mentioned in the Qur'an", "They are all names of Al-Kitaab"], "ans": 1, "exp": "Scholars clarify that most are descriptions and attributes, not actual independent names. (Section: The 5 Primary Names of the Qur'an)"}, {"q": "Which verse describes the Qur'an as 'a cure for what is in the breasts'?", "opts": ["[10:57]", "[39:23]", "[18:1-2]", "[25:1]"], "ans": 0, "exp": "[10:57] mentions good advice, a cure for what is in the breasts, guidance and mercy. (Section: The Qur'an Describing Itself)"}, {"q": "Which verse says Allah has not placed any crookedness in the Book?", "opts": ["[39:23]", "[18:1-2]", "[10:57]", "[2:1-2]"], "ans": 1, "exp": "[18:1-2] says Allah sent down the Book and has not placed therein any crookedness. (Section: The Qur'an Describing Itself)"}, {"q": "'The best of you are those who learn the Qur'an and teach it to others' is narrated by:", "opts": ["'Umar ibn al-Khattaab", "Ibn Mas'ood", "Anas ibn Maalik", "Aboo Hurayrah"], "ans": 1, "exp": "The notes attribute it to Ibn Mas'ood, in al-Bukhaaree. (Section: Hadith: Status of the Qur'an)"}, {"q": "Who narrated 'The People of the Qur'an are the People of Allah and His Chosen ones'?", "opts": ["Anas ibn Maalik", "'Aa'ishah", "Ibn Mas'ood", "Aboo Moosaa al-Ash'aree"], "ans": 0, "exp": "It is from Anas ibn Maalik, recorded by an-Nasaa'ee. (Section: Hadith: Status of the Qur'an)"}, {"q": "According to the intercessor hadith, what happens to the one who throws the Qur'an behind his back?", "opts": ["It leads him to Paradise", "It drags him to the Fire", "It intercedes for him anyway", "He gets a double reward"], "ans": 1, "exp": "Whoever throws it behind his back, it drags him to the Fire. (Section: Hadith: Status of the Qur'an)"}, {"q": "A person recites 'Alif-Laam-Meem'. By the hadith, how many letters has he read?", "opts": ["One", "Three", "Ten", "Thirty"], "ans": 1, "exp": "Alif is a letter, Laam is a letter and Meem is a letter, each earning one hasanah equal to ten of its like. (Section: Rewards for Reciting the Qur'an)"}, {"q": "In the analogy, the hypocrite who recites the Qur'an is like:", "opts": ["Citrus fruit", "Dry date", "Basil", "Colocynth"], "ans": 2, "exp": "The hypocrite who recites is like basil: nice smell, bitter taste. (Section: Rewards for Reciting the Qur'an)"}], "3": [{"q": "Which three qualities does the word 'Wahy' imply, according to the notes?", "opts": ["Urgency, hiddenness and directness", "Clarity, loudness and repetition", "Writing, recitation and memorization", "Patience, gradualness and ease"], "ans": 0, "exp": "Wahy means to communicate secretly and swiftly, not in an obvious manner, implying urgency, hiddenness and directness. (Section: What is Wahy?)"}, {"q": "According to [42:51], which of these is NOT one of the 3 ways Allah communicates with prophets?", "opts": ["Direct wahy", "Speech from behind a veil", "Through an angel (Jibreel)", "Through a written tablet handed to the prophet"], "ans": 3, "exp": "[42:51] gives three ways: direct wahy, speech from behind a veil, or through an angel. (Section: What is Wahy?)"}, {"q": "[16:68] 'Your Lord inspired the bee...' is an example of which linguistic use of wahy?", "opts": ["Natural laws of nature", "Animal instinct", "Human intuition (ilhaam)", "Guidance to angels"], "ans": 1, "exp": "The inspiration of the bee is listed as animal instinct. (Section: 7 Linguistic Uses of 'Wahy' in the Qur'an)"}, {"q": "Allah inspiring the mother of Moosa [28:7] is an example of:", "opts": ["Revelation to Prophets", "Signals/gestures", "Human intuition (ilhaam)", "Evil whispers of Shaytaan"], "ans": 2, "exp": "[28:7] is given as the example of human intuition, called ilhaam. (Section: 7 Linguistic Uses of 'Wahy' in the Qur'an)"}, {"q": "Zakariyyah communicating through hand signals [19:11] illustrates which use of wahy?", "opts": ["Signals/gestures", "Animal instinct", "Natural laws of nature", "Revelation to Prophets"], "ans": 0, "exp": "Zakariyyah's hand signals are the example of wahy as signals/gestures. (Section: 7 Linguistic Uses of 'Wahy' in the Qur'an)"}, {"q": "Which verse is cited for wahy as the natural laws of nature, where Allah 'inspired' the heavens with their commands?", "opts": ["[8:12]", "[41:12]", "[4:163]", "[6:121]"], "ans": 1, "exp": "[41:12] is the example for natural laws of nature. (Section: 7 Linguistic Uses of 'Wahy' in the Qur'an)"}, {"q": "According to 'Aa'ishah in al-Bukhaaree, the true dreams at the start of revelation were like what?", "opts": ["The ringing of a bell", "The rising of the sun", "A heavy speech", "The shaking of the heavens"], "ans": 1, "exp": "She described the good, true dreams as coming like the rising of the sun. (Section: Method A: WITHOUT an Intermediary (Direct from Allah))"}, {"q": "Where did Allah speak directly to Moosa?", "opts": ["Cave of Hiraa", "Bayt al-'Izza", "Mount Toor", "Above the 7 skies"], "ans": 2, "exp": "Allah spoke directly to Moosa on Mount Toor [7:143]. (Section: Method A: WITHOUT an Intermediary (Direct from Allah))"}, {"q": "According to Sahih Muslim (173), which of these was NOT among what the Prophet was given at al-Mi'raaj?", "opts": ["The five prayers", "The last verses of al-Baqarah", "Remission of serious sins that do not involve shirk", "The first verses revealed in the Cave of Hiraa"], "ans": 3, "exp": "The hadith lists the five prayers, the last verses of al-Baqarah, and remission of serious sins not involving shirk. (Section: Method A: WITHOUT an Intermediary (Direct from Allah))"}, {"q": "In the hadith from al-Bukhaaree, what happens to the angels when Allah speaks?", "opts": ["They fall in swoon", "They write it down at once", "They descend to earth", "They recite it back to Allah"], "ans": 0, "exp": "The heavens shake severely and the angels fall in swoon; Jibreel is the first to raise his head. (Section: Method B: WITH Jibreel as Intermediary (Primary Method))"}, {"q": "When Jibreel came in the form of a man, what did the Companions see?", "opts": ["Jibreel with his 600 wings", "Only a man", "Nothing at all", "Jibreel in his natural form"], "ans": 1, "exp": "Only the Prophet could see Jibreel; the Companions saw only a man. (Section: Method B: WITH Jibreel as Intermediary (Primary Method))"}, {"q": "A narration says the Prophet sweated heavily on a cold night while receiving revelation. Which way of receiving from Jibreel does this match?", "opts": ["Jibreel in the form of a man", "True dreams", "Like the ringing of a bell", "Inspiration whispered into the heart"], "ans": 2, "exp": "In the bell-like way, the Prophet would sweat profusely even on cold nights. (Section: Method B: WITH Jibreel as Intermediary (Primary Method))"}, {"q": "Which verse is cited as proof that Jibreel was chosen by Allah to deliver the Qur'an?", "opts": ["[26:192-194]", "[42:51]", "[73:5]", "[7:143]"], "ans": 0, "exp": "Jibreel was chosen by Allah [26:192-194] to deliver the Qur'an. (Section: Method B: WITH Jibreel as Intermediary (Primary Method))"}, {"q": "In Ibn al-Qayyim's classification, which type was NOT a way the Qur'an was revealed?", "opts": ["Angel in human form speaking", "Like ringing of a bell", "Inspiration whispered into heart by angel", "Seeing angel in natural form"], "ans": 2, "exp": "Only true dreams and inspiration whispered into the heart by an angel are marked as not used for the Qur'an. (Section: Ibn al-Qayyim's 7-Type Classification)"}], "4": [{"q": "Out of the 23 years of revelation, how many were in Makkah?", "opts": ["10", "13", "15", "23"], "ans": 1, "exp": "The Qur'an was revealed over 23 years: 13 in Makkah and 10 in Madeenah. (Section: The Core Question)"}, {"q": "According to [25:32], why was the Qur'an sent down in parts?", "opts": ["To strengthen the Prophet's heart", "Because it was too long to send at once", "To test the disbelievers' patience", "So that it could be written on the Lauh al-Mahfoodh"], "ans": 0, "exp": "Allah answered: 'Thus (it is sent down in parts) that We may strengthen your heart thereby.' (Section: The Core Question)"}, {"q": "In the hadith about the Pen, what was the first thing Allah created?", "opts": ["The Preserved Tablet", "The Pen", "Bayt al-'Izza", "The heavens"], "ans": 1, "exp": "'The first thing Allah created was the Pen,' and it was told to write the destiny of all things. (Section: The 3 Stages of Revelation)"}, {"q": "Which verse is the evidence that the Qur'an is inscribed in the Lauh al-Mahfoodh?", "opts": ["[97:1]", "[2:185]", "[85:21-22]", "[26:192-194]"], "ans": 2, "exp": "[85:21-22]: 'Nay! This is indeed a Glorious Qur'an! (Inscribed) in the Lauh al-Mahfoodh.' (Section: The 3 Stages of Revelation)"}, {"q": "In which stage did the Qur'an come down ALL AT ONCE?", "opts": ["Stage 1", "Stage 2", "Stage 3", "In none of the stages"], "ans": 1, "exp": "Stage 2, from the Lauh al-Mahfoodh to Bayt al-'Izza, was all at once on Laylat al-Qadr. (Section: The 3 Stages of Revelation)"}, {"q": "A student cites [26:192-194] about the trustworthy angel bringing the Qur'an 'upon your heart'. Which stage is this evidence for?", "opts": ["Stage 1: Lauh al-Mahfoodh", "Stage 2: to Bayt al-'Izza", "Stage 3: to the Prophet through Jibreel", "The creation of the Pen"], "ans": 2, "exp": "[26:192-194] is given as the evidence for Stage 3, from Bayt al-'Izza to the Prophet through Jibreel. (Section: The 3 Stages of Revelation)"}, {"q": "In Stage 3, when would Jibreel bring verses?", "opts": ["Only in Ramadaan", "In response to events, questions and circumstances as they arose", "Only on Laylat al-Qadr", "Only after the Hijrah to Madeenah"], "ans": 1, "exp": "Jibreel brought verses in response to events, questions and circumstances as they arose. (Section: The 3 Stages of Revelation)"}, {"q": "Which two verses are given as evidence for Stage 2?", "opts": ["[2:185] and [97:1]", "[85:21-22] and [25:32]", "[4:82] and [25:33]", "[15:97] and [26:192-194]"], "ans": 0, "exp": "[2:185] on the month of Ramadaan and [97:1] on the Night of Decree. (Section: The 3 Stages of Revelation)"}, {"q": "Which verse is linked to proving the Qur'an's miraculous nature, with zero contradictions?", "opts": ["[25:33]", "[4:82]", "[15:97]", "[97:1]"], "ans": 1, "exp": "6000+ verses over 23 years with zero contradictions [4:82]. (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "Roughly how many verses does the notes' table say were revealed over 23 years?", "opts": ["600+", "1000+", "6000+", "10,000+"], "ans": 2, "exp": "The table says 6000+ verses over 23 years with zero contradictions. (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "Besides [25:32], which verse is cited for strengthening the Prophet's resolve against insults and persecution?", "opts": ["[15:97]", "[4:82]", "[2:185]", "[85:21-22]"], "ans": 0, "exp": "Wisdom 1 cites [25:32, 15:97] against insults and persecution from disbelievers. (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "The prohibition of wine not coming first is an example of which wisdom?", "opts": ["Prove its miraculous nature", "Gradually introduce Islamic law", "Ease the revelation process on the Prophet", "Strengthen the Prophet's resolve"], "ans": 1, "exp": "'Aa'ishah's statement about wine is the example for gradually introducing Islamic law. (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "Because the Prophet sweated profusely during revelation, receiving it gradually meant less overall burden. Which wisdom is this?", "opts": ["Ease memorization for the Companions", "Prove the Prophet's truthfulness", "Ease the revelation process on the Prophet", "Prove its miraculous nature"], "ans": 2, "exp": "This is the sixth wisdom, easing the revelation process on the Prophet. (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "Who said that all of this shows the concern and high status given to the Prophet ﷺ?", "opts": ["Imaam Ahmad", "Ibn al-Qayyim", "Ibn Katheer", "'Aa'ishah"], "ans": 2, "exp": "This quote is from Ibn Katheer (d.774 AH). (Section: 6 Wisdoms of Gradual Revelation)"}, {"q": "True or False: The Companions memorized 10 verses but only acted on them after the whole Qur'an was complete.", "opts": ["True", "False"], "ans": 1, "exp": "False. They memorized AND acted on the 10 verses before receiving more. (Section: 6 Wisdoms of Gradual Revelation)"}], "5": [{"q": "When Jibreel commanded \"Read!\", what did the Prophet ﷺ reply?", "opts": ["\"What shall I read?\"", "\"I am not able to read.\"", "\"Cover me! Cover me!\"", "\"Who are you?\""], "ans": 1, "exp": "Each time Jibreel commanded him to read, the Prophet replied: \"I am not able to read.\" (Section: The First Revelation — 2 Opinions)"}, {"q": "According to Waraqah ibn Nawfal, the angel who came to the Prophet was the same angel Allah sent to whom?", "opts": ["Ibraaheem", "'Eesaa", "Moosa", "Nooh"], "ans": 2, "exp": "Waraqah confirmed: \"This is the angel that Allah sent to Moosa!\" (Section: The First Revelation — 2 Opinions)"}, {"q": "Who narrated the opinion that Soorah al-Muddathir was the first revelation?", "opts": ["Ibn Abbaas", "Jaabir ibn 'Abdillaah", "Sa'eed ibn al-Mussayyib", "Waraqah ibn Nawfal"], "ans": 1, "exp": "The second opinion comes from Jaabir ibn 'Abdillaah, whose narration is reconciled with the majority view. (Section: The First Revelation — 2 Opinions)"}, {"q": "Which verse is cited for the second opinion on the first revelation?", "opts": ["96:1", "74:1", "110:1", "2:281"], "ans": 1, "exp": "The second opinion is Soorah al-Muddathir [74:1]: \"O you enveloped (in garments)!\" (Section: The First Revelation — 2 Opinions)"}, {"q": "Besides the 'first complete soorah' explanation, how else is Jaabir's narration reconciled with the majority view?", "opts": ["He was speaking of Madeenan revelation only", "He only heard the latter part of the story, missing the very beginning", "He was narrating from Waraqah", "He confused it with the last revelation"], "ans": 1, "exp": "One reconciliation is that Jaabir only heard the latter part of the story and missed the very beginning. (Section: The First Revelation — 2 Opinions)"}, {"q": "What did the Prophet ﷺ do after Jibreel recited [96:1-5]?", "opts": ["He wrote it down", "He repeated after him", "He remained silent", "He went to Aboo Bakr"], "ans": 1, "exp": "After the three presses, Jibreel recited [96:1-5] and the Prophet repeated after him. (Section: The First Revelation — 2 Opinions)"}, {"q": "Which soorah is described as the last COMPLETE soorah revealed?", "opts": ["Soorah al-Muddathir", "Soorah al-'Alaq", "Soorah an-Nasr", "Soorah al-Baqarah"], "ans": 2, "exp": "Opinion 4 holds that Soorah an-Nasr [110] was the last complete soorah revealed. (Section: The Last Revelation — 5 Opinions)"}, {"q": "The opinion that Soorah an-Nasr was the last complete soorah is based on a narration from Ibn Abbaas found in which collection?", "opts": ["al-Bukhaaree", "Muslim", "Abu Dawood", "at-Tirmidhee"], "ans": 1, "exp": "The evidence for an-Nasr is Ibn Abbaas in Muslim, while 2:281 is from Ibn Abbaas in al-Bukhaaree. (Section: The Last Revelation — 5 Opinions)"}, {"q": "The opinion that 2:282 (the verse of debt) was the last revelation is attributed to whom?", "opts": ["Ibn Abbaas", "Jaabir ibn 'Abdillaah", "Sa'eed ibn al-Mussayyib", "as-Suyootee"], "ans": 2, "exp": "Opinion 3 (2:282, rated moderate) is from Sa'eed ibn al-Mussayyib. (Section: The Last Revelation — 5 Opinions)"}, {"q": "Verse 2:278, the second opinion for the last revelation, concerns what?", "opts": ["Writing down a debt", "Giving up what remains of interest", "Fearing the Day of return to Allah", "Perfecting the religion"], "ans": 1, "exp": "2:278 says: \"Fear Allah and give up what remains of your interest...\" (Section: The Last Revelation — 5 Opinions)"}, {"q": "How did as-Suyootee reconcile opinions 1-3 on the last revelation?", "opts": ["He declared 2:282 the strongest", "He said all three were revealed together at the same time", "He said they were revealed in different years", "He rejected all three in favour of 5:3"], "ans": 1, "exp": "as-Suyootee said there is no contradiction: all three were revealed together, being from the same passage, 2:278-282. (Section: The Last Revelation — 5 Opinions)"}, {"q": "According to the notes, what does 5:3 (\"Today I have perfected your religion\") refer to?", "opts": ["The end of all revelation", "The completion of halaal/haraam laws", "The conquest of Makkah", "The compilation of the mus-haf"], "ans": 1, "exp": "5:3 refers to the completion of halaal/haraam laws, NOT the end of all revelation. (Section: The Last Revelation — 5 Opinions)"}, {"q": "True or False: There is a hadith in which the Prophet ﷺ explicitly said, \"This is the final verse I received.\"", "opts": ["True", "False"], "ans": 1, "exp": "False. No such hadith exists, so scholars weighed the strongest evidence instead. (Section: The Last Revelation — 5 Opinions)"}, {"q": "A student says: \"2:281 and Soorah an-Nasr cannot both be 'last' — one opinion must be wrong.\" What is the best response based on the notes?", "opts": ["2:281 is incorrect, so an-Nasr is last", "They are in different categories: last verse vs. last complete soorah", "Both are rejected in favour of 5:3", "an-Nasr was revealed on the Day of 'Arafah"], "ans": 1, "exp": "An-Nasr is rated strong but in a different category: it is the last complete soorah, while 2:281 is the strongest opinion for the last verse. (Section: The Last Revelation — 5 Opinions)"}, {"q": "How many opinions on the last revelation are listed in the notes?", "opts": ["2", "3", "4", "5"], "ans": 3, "exp": "The notes list 5 opinions on the last revelation, from 2:281 (strongest) to 5:3 (incorrect). (Section: The Last Revelation — 5 Opinions)"}], "6": [{"q": "Which verse contains Allah's promise to guard the Reminder (Dhikr)?", "opts": ["2:281", "5:3", "15:9", "96:1"], "ans": 2, "exp": "[15:9]: \"Indeed, it is We who sent down the Reminder (Dhikr), and indeed, it is We who are its Guardian.\" (Section: Allah's Promise of Preservation)"}, {"q": "Which of these is listed as a material the Qur'an was written on during the Prophet's lifetime?", "opts": ["Smooth stones", "Clay tablets", "Papyrus scrolls", "Bound books"], "ans": 0, "exp": "The materials listed are shoulder bones, smooth stones, date-palm leaves, saddles and leather. (Section: Stage 1: During the Prophet's Lifetime ﷺ)"}, {"q": "Zayd ibn Thaabit said: \"We used to compile the Qur'an from scraps of ___.\"", "opts": ["Bone", "Leather", "Date-palm leaves", "Stone"], "ans": 1, "exp": "Zayd ibn Thaabit said: \"We used to compile the Qur'an from scraps of leather.\" (Section: Stage 1: During the Prophet's Lifetime ﷺ)"}, {"q": "Which of these is one of the 4 reasons the Qur'an was NOT compiled into one book during the Prophet's lifetime?", "opts": ["There were not enough scribes", "Revelation was still continuing", "Writing materials were forbidden", "The Companions disagreed on recitation"], "ans": 1, "exp": "Revelation was still continuing (the last verse came only 9 days before his death), so a single book was not yet possible. (Section: Stage 1: During the Prophet's Lifetime ﷺ)"}, {"q": "Why did the non-chronological arrangement of the Qur'an prevent compilation during the Prophet's lifetime?", "opts": ["It required divine guidance", "It was left to the Companions", "It followed the order of revelation", "It was decided by 'Uthmaan"], "ans": 0, "exp": "The arrangement was non-chronological and required divine guidance, which is one of the 4 reasons. (Section: Stage 1: During the Prophet's Lifetime ﷺ)"}, {"q": "What did Aboo Bakr say when 'Umar first urged him to compile the Qur'an?", "opts": ["\"Bring me Zayd ibn Thaabit.\"", "\"How can I do what the Prophet did not do?\"", "\"Use the dialect of Quraysh.\"", "\"Whoever has learnt any Qur'an, bring it forth.\""], "ans": 1, "exp": "Aboo Bakr hesitated, saying: \"How can I do what the Prophet did not do?\" (Section: Stage 2: Aboo Bakr's Compilation (12 AH))"}, {"q": "How did 'Umar convince Aboo Bakr that compiling the Qur'an was permissible?", "opts": ["It was a direct command of the Prophet", "It was maslaha (public benefit), not bid'ah", "Hudhayfah had requested it", "It was the practice of the Jews and Christians"], "ans": 1, "exp": "'Umar argued that compilation was maslaha (public benefit), not bid'ah (forbidden innovation). (Section: Stage 2: Aboo Bakr's Compilation (12 AH))"}, {"q": "In what year did Aboo Bakr's compilation take place?", "opts": ["12 AH", "24 AH", "25 AH", "9 AH"], "ans": 0, "exp": "Aboo Bakr's compilation is dated 12 AH, while 'Uthmaan's standardization was 24-25 AH. (Section: Stage 2: Aboo Bakr's Compilation (12 AH))"}, {"q": "A man brings a verse written under the Prophet's supervision, but no one else testifies that he learned it directly from the Prophet. Under Zayd's rule, is this enough?", "opts": ["Yes, a supervised written copy is enough", "No, at least 2 people who learned directly from the Prophet are also required", "Yes, if 'Umar approves it", "No, 3 written copies are required"], "ans": 1, "exp": "Zayd's double-verification rule required at least 2 people who learned from the Prophet AND at least 1 supervised written copy. (Section: Stage 2: Aboo Bakr's Compilation (12 AH))"}, {"q": "Who said: \"The person with the greatest rewards regarding the mus-haf is Aboo Bakr\"?", "opts": ["'Umar", "Zayd ibn Thaabit", "'Alee ibn Abee Taalib", "Hudhayfah ibn al-Yamaan"], "ans": 2, "exp": "This statement is from 'Alee ibn Abee Taalib, praising Aboo Bakr's compilation. (Section: Stage 2: Aboo Bakr's Compilation (12 AH))"}, {"q": "Which of these was NOT a member of 'Uthmaan's 4-man committee?", "opts": ["'Abdullaah ibn az-Zubayr", "Sa'eed ibn al-'Aas", "Ubay ibn Ka'ab", "'Abd al-Rahmaan ibn al-Haarith"], "ans": 2, "exp": "The committee was Zayd ibn Thaabit, 'Abdullaah ibn az-Zubayr, Sa'eed ibn al-'Aas and 'Abd al-Rahmaan ibn al-Haarith. Ubay ibn Ka'ab is listed among the memorizers. (Section: Stage 3: 'Uthmaan's Standardization (24-25 AH))"}, {"q": "Which reciter was sent with the copy to Koofah?", "opts": ["Zayd ibn Thaabit", "al-Mugheerah ibn Shu'bah", "Aboo 'Abd ar-Rahmaan as-Sulamee", "Aamir ibn 'Abd al-Qays"], "ans": 2, "exp": "Aboo 'Abd ar-Rahmaan as-Sulamee was sent with the Koofah copy. (Section: Stage 3: 'Uthmaan's Standardization (24-25 AH))"}, {"q": "Which reciter was sent with the copy to Syria?", "opts": ["'Abdullaah ibn Saa'ib", "al-Mugheerah ibn Shu'bah", "Aamir ibn 'Abd al-Qays", "Sa'eed ibn al-'Aas"], "ans": 1, "exp": "al-Mugheerah ibn Shu'bah was sent with the Syrian copy. (Section: Stage 3: 'Uthmaan's Standardization (24-25 AH))"}, {"q": "What happened to the non-standard copies after 'Uthmaan's standardization?", "opts": ["They were kept with Hafsah", "They were sent to Basrah", "They were destroyed", "They were used as commentaries"], "ans": 2, "exp": "All other non-standard copies were destroyed, unifying the ummah on one reading. (Section: Stage 3: 'Uthmaan's Standardization (24-25 AH))"}, {"q": "According to Ibn Taymiyyah's summary, the final recitation is whose recitation?", "opts": ["Ibn Mas'ood's", "Ubay ibn Ka'ab's", "Zayd ibn Thaabit's", "'Uthmaan's"], "ans": 2, "exp": "Ibn Taymiyyah said the final recitation is Zayd ibn Thaabit's, recited to Jibreel in the last year of the Prophet's life. (Section: Stage 3: 'Uthmaan's Standardization (24-25 AH))"}], "8": [{"q": "What is the singular of 'ahruf'?", "opts": ["Harf", "Qiraa'a", "Raawi", "Qaaree"], "ans": 0, "exp": "Ahruf is the plural; its singular is harf. (Section: What are the Ahruf?)"}, {"q": "According to the notes, what are the ahruf?", "opts": ["Different Qur'ans revealed to different tribes", "Different meanings for the same verse", "Different valid pronunciations and word choices for the same revelation", "Copies of the mus-haf sent to different cities"], "ans": 2, "exp": "The ahruf are NOT different Qur'ans or different meanings, but different valid pronunciations and word choices for the same revelation. (Section: What are the Ahruf?)"}, {"q": "Who said: 'Every variation of a word in the Qur'an is a harf'?", "opts": ["Ibn Shihaab az-Zuhree", "Imaam al-Qurtubee", "Ibn Qutaybah", "Ibn al-Jazaree"], "ans": 1, "exp": "This definition is quoted from Imaam al-Qurtubee. (Section: What are the Ahruf?)"}, {"q": "In the hadith of Ibn Abbaas, how did the number of ahruf reach seven?", "opts": ["Jibreel brought all seven at once", "The Companions asked for more", "The Prophet asked Jibreel to increase, and he kept increasing until seven", "Allah revealed one harf each year"], "ans": 2, "exp": "Jibreel first recited in one harf; the Prophet asked him to increase and he increased until they reached seven. (Section: 3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf)"}, {"q": "Which soorah was Hishaam ibn Hakeem reciting when 'Umar objected?", "opts": ["Soorah al-Muddathir", "Soorah al-Furqaan", "Soorah al-Baqarah", "Soorah an-Nasr"], "ans": 1, "exp": "'Umar heard Hishaam ibn Hakeem reciting Soorah al-Furqaan differently from how he was taught. (Section: 3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf)"}, {"q": "After hearing both 'Umar and Hishaam, what did the Prophet tell them to do?", "opts": ["Soorah al-Muddathir", "Soorah al-Furqaan", "Soorah al-Baqarah", "Soorah an-Nasr"], "ans": 1, "exp": "He said both are correct, the Qur'an was revealed in seven ahruf, so recite whichever is easy. (Section: 3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf)"}, {"q": "Which Companion narrated the hadith in which the Prophet said, 'I have been sent to an illiterate nation'?", "opts": ["Ibn Abbaas", "'Umar ibn al-Khattaab", "Ubay ibn Ka'ab", "Hishaam ibn Hakeem"], "ans": 2, "exp": "This hadith is reported by Ubay ibn Ka'ab and collected by at-Tirmidhee. (Section: 3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf)"}, {"q": "The hadith of 'Umar and Hishaam is recorded in which collection(s), according to the notes?", "opts": ["Soorah al-Muddathir", "Soorah al-Furqaan", "Soorah al-Baqarah", "Soorah an-Nasr"], "ans": 1, "exp": "The notes cite al-Bukhaaree and Muslim for the 'Umar-Hishaam hadith. (Section: 3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf)"}, {"q": "Two Companions recite a verse with different ahruf, and both learned it from the Prophet. Based on the conclusions, how should this be viewed?", "opts": ["Only the more common one is valid", "Each harf is complete and valid in itself", "Both must be combined into one reading", "The later one cancels the earlier"], "ans": 1, "exp": "One of the conclusions is that each harf is complete and valid in and of itself, and the Prophet taught different ahruf to different Companions. (Section: 4 Key Conclusions from These Narrations)"}, {"q": "Which of these scholars is NOT listed as holding the strongest opinion on the meaning of the 7 ahruf?", "opts": ["Ibn Qutaybah", "al-Baaqillaanee", "Ibn al-Jazaree", "Imaam al-Qurtubee"], "ans": 3, "exp": "The strongest opinion is attributed to Ibn Qutaybah, al-Baaqillaanee and Ibn al-Jazaree; al-Qurtubee is quoted for the definition of harf. (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}, {"q": "Variations such as tashheel and imaalah fall under which type of variation?", "opts": ["Change in word order", "Differences in inflection points", "Differences in pronunciation", "Form/structure change"], "ans": 2, "exp": "Type 7, differences in pronunciation, covers tashheel and imaalah (accent/phonetic variations). (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}, {"q": "A reading changes a word from plural to singular. Which type of variation is this?", "opts": ["Form/structure change", "Addition or subtraction of a letter/word", "Change in wording", "Differences in letters"], "ans": 0, "exp": "Plural/singular and gender changes are Type 5, form/structure change, with [23:8] as the example. (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}, {"q": "Which verse is given as the example for 'addition or subtraction of a letter/word'?", "opts": ["[3:195]", "[57:24]", "[23:8]", "[2:125]"], "ans": 1, "exp": "[57:24] is listed as the example for addition or subtraction of a letter/word. (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}, {"q": "Which type of variation is illustrated by [3:195]?", "opts": ["Differences in inflection points", "Change in word order", "Change in wording", "Differences in pronunciation"], "ans": 1, "exp": "[3:195] is the example for change in word order. (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}, {"q": "Which verse is given as the example for 'differences in inflection points'?", "opts": ["[2:125]", "[23:8]", "[57:24]", "[3:195]"], "ans": 0, "exp": "[2:125] is listed as the example for differences in inflection points. (Section: What Do the 7 Ahruf Actually Mean? (Strongest Opinion))"}], "9": [{"q": "What are the two main students of each Qaaree called?", "opts": ["Raawis", "Qaarees", "Huffaadh", "Companions"], "ans": 0, "exp": "Each Qaaree has 2 main students called Raawis. (Section: What are the Qira'at?)"}, {"q": "Who said: 'The recitation of the Qur'an is a Sunnah; the later generations must take it from the earlier ones'?", "opts": ["Ibn al-Jazaree", "'Umar ibn al-Khattaab", "Ubay ibn Ka'ab", "Imaam al-Qurtubee"], "ans": 1, "exp": "The notes attribute this statement to 'Umar ibn al-Khattaab. (Section: What are the Qira'at?)"}, {"q": "A reading follows Arabic grammar and has a mutawaatir chain, but matches none of the Uthmaanic mus-hafs. Is it a valid qiraa'a?", "opts": ["Yes, two conditions are enough", "Yes, if it is famous", "No, all 3 conditions must be met", "Yes, but only outside prayer"], "ans": 2, "exp": "All 3 conditions must be met; if any one is missing, the reading is not a valid qiraa'a. (Section: 3 Conditions for an Authentic Qiraa'a (Ibn al-Jazaree, d.832 AH))"}, {"q": "Which of the following is NOT one of Ibn al-Jazaree's 3 conditions for an authentic qiraa'a?", "opts": ["Conforms to Arabic grammar", "Matches at least one Uthmaanic mus-haf", "Has an authentic mutawaatir chain", "Is recited by the majority of Muslims"], "ans": 3, "exp": "The three conditions are grammar, matching an Uthmaanic mus-haf, and an authentic mutawaatir chain. (Section: 3 Conditions for an Authentic Qiraa'a (Ibn al-Jazaree, d.832 AH))"}, {"q": "A reading fits Arabic grammar and the Uthmaanic script but has no authentic chain. What type is it?", "opts": ["Saheeh", "Shaadh", "Da'eef", "Baatil"], "ans": 2, "exp": "Da'eef (Weak) meets grammar and Uthmaanic script but has no authentic chain, so it is not Qur'an. (Section: 4 Types of Qira'at)"}, {"q": "Which type of qiraa'a meets none of the conditions and is completely rejected?", "opts": ["Shaadh", "Da'eef", "Baatil", "Saheeh"], "ans": 2, "exp": "Baatil (False) meets none of the conditions and is completely rejected. (Section: 4 Types of Qira'at)"}, {"q": "Which non-authentic type of reading may still be studied as tafseer?", "opts": ["Baatil", "Da'eef", "Shaadh", "Saheeh"], "ans": 2, "exp": "Shaadh is not Qur'an but may be studied as tafseer. (Section: 4 Types of Qira'at)"}, {"q": "From which city was the Qaaree Ibn Katheer?", "opts": ["Madeenah", "Makkah", "Basrah", "Koofah"], "ans": 1, "exp": "Ibn Katheer al-Makkee was from Makkah and died 120 AH. (Section: The 10 Authentic Qaarees)"}, {"q": "Which two Qaarees are listed as being from Koofah?", "opts": ["'Aasim and Hamzah", "Naafi' and Aboo Jaa'far", "Aboo 'Amr and Ya'qoob", "al-Kisaa'ee and Khalaf"], "ans": 0, "exp": "'Aasim al-Koofee and Hamzah al-Koofee are both from Koofah. (Section: The 10 Authentic Qaarees)"}, {"q": "Qaloon and Warsh are the Raawis of which Qaaree?", "opts": ["'Aasim al-Koofee", "Naafi' al-Madanee", "Ibn 'Aamir ash-Shaamee", "Aboo Jaa'far al-Madanee"], "ans": 1, "exp": "Naafi' al-Madanee's Raawis are Qaloon and Warsh. (Section: The 10 Authentic Qaarees)"}, {"q": "Which Qaaree is listed with the latest death date, 229 AH?", "opts": ["Ya'qoob al-Basree", "al-Kisaa'ee", "Khalaf al-'Aashir", "Naafi' al-Madanee"], "ans": 2, "exp": "Khalaf al-'Aashir of Baghdad died 229 AH. (Section: The 10 Authentic Qaarees)"}, {"q": "Qaloon 'an Naafi' is mainly found in which countries, according to the notes?", "opts": ["Algeria and Morocco", "Libya and Tunisia", "Parts of Yemen", "West Africa"], "ans": 1, "exp": "Qaloon 'an Naafi' (~0.7%) is listed for Libya and Tunisia. (Section: The 10 Authentic Qaarees)"}, {"q": "In Al-Maa'idah 5:6, the reading 'arjulikum' (genitive) indicates what, and when does it apply?", "opts": ["Wash the feet; for bare feet", "Wipe over the feet; when wearing leather socks", "Wash the feet; when wearing leather socks", "Wipe over the feet; for bare feet"], "ans": 1, "exp": "Arjulikum means wipe over your feet, which applies when wearing leather socks; arjulakum (wash) is for bare feet. (Section: Example: How Different Qira'at Add Meaning)"}, {"q": "Taken together, what do the readings 'Maaliki' and 'Maliki' in al-Faatihah 1:4 teach?", "opts": ["One reading cancels the other", "Allah is both the King and the Owner of the Day of Judgement", "Only the Owner meaning is correct", "They refer to two different days"], "ans": 1, "exp": "Together they show Allah is both the King and the Owner of the Day of Judgement. (Section: Example: How Different Qira'at Add Meaning)"}, {"q": "Which benefit of the qira'at is linked to all chains being mutawaatir?", "opts": ["Removes stagnation", "Facilitation of memorization", "Proof of exact preservation", "Indication of miraculous nature"], "ans": 2, "exp": "Proof of exact preservation is the benefit tied to all chains being mutawaatir. (Section: 5 Benefits of the Different Qira'at)"}], "10": [{"q": "What is the main problem with the PLACE-based definition of Makkee and Madanee?", "opts": ["It cannot classify verses revealed elsewhere, such as Tabook or Jerusalem", "Many verses address all mankind", "It ignores the Farewell Pilgrimage", "It has no problem at all"], "ans": 0, "exp": "The place-based definition cannot classify verses revealed outside Makkah and Madeenah, such as at Tabook or Jerusalem. (Section: 3 Definitions — Which is Correct?)"}, {"q": "What is the main problem with the ADDRESSEE-based definition?", "opts": ["It cannot classify verses revealed at Tabook", "Many verses address all mankind or the People of the Book", "It depends on the date of the Hijrah", "It only covers the disputed soorahs"], "ans": 1, "exp": "The addressee-based definition fails because many verses address all mankind or the People of the Book, not just Quraysh or the Muslims. (Section: 3 Definitions — Which is Correct?)"}, {"q": "Under the addressee-based definition, a Madanee verse is one that addresses:", "opts": ["Quraysh and the polytheists", "Muslims and hypocrites", "Only the People of the Book", "The previous nations"], "ans": 1, "exp": "Definition 3 says Madanee verses address the Muslims and hypocrites, while Makkee verses address Quraysh and the polytheists. (Section: 3 Definitions — Which is Correct?)"}, {"q": "Verse 5:3 (\"Today I have perfected your religion...\") was revealed in which setting?", "opts": ["During the Farewell Pilgrimage in Makkah", "At Tabook", "In Madeenah before the Hijrah", "In Jerusalem"], "ans": 0, "exp": "It was revealed during the Farewell Pilgrimage in Makkah, yet it is classified as Madanee because it came after the Hijrah. (Section: 3 Definitions — Which is Correct?)"}, {"q": "According to the notes, how long did the Makkah phase of revelation last?", "opts": ["10 years", "13 years", "20 years", "23 years"], "ans": 1, "exp": "The Qur'an was revealed over two phases: Makkah (13 years) and Madeenah (10 years). (Chapter introduction)"}, {"q": "Makkee soorahs taught morality, such as caring for orphans. What did they NOT yet contain?", "opts": ["Stories of previous nations", "Mention of the Day of Judgement", "Specific legal rulings", "Affirmation of Allah's Names and Attributes"], "ans": 2, "exp": "Makkee soorahs gave broad moral principles like care for orphans and no female infanticide, but no specific legal rulings yet. (Section: Themes of MAKKEE Soorahs)"}, {"q": "In Makkee soorahs, what purpose did the stories of previous nations serve?", "opts": ["To set out inheritance laws", "Encouragement for the believers and warnings for the disbelievers", "To debate the Jews and Christians", "To expose the hypocrites"], "ans": 1, "exp": "The stories gave encouragement to the believers and warnings to the disbelievers. (Section: Themes of MAKKEE Soorahs)"}, {"q": "Which of these is a theme of MADANEE soorahs?", "opts": ["Pure Tawheed against false deities", "Stories of the creation of Aadam", "System of laws such as marriage, inheritance and hudood", "Short verses with frequent oaths"], "ans": 2, "exp": "Madanee soorahs set out a system of laws: jihaad, marriage, inheritance, governance and hudood punishments. (Section: Themes of MADANEE Soorahs)"}, {"q": "Why did dialogue with Jews and Christians appear in Madanee soorahs?", "opts": ["To expose corruption in their books and clarify the truth", "To set the times of prayer", "To tell the story of Aadam", "To warn Quraysh"], "ans": 0, "exp": "Madanee soorahs engaged the Jews and Christians, exposing corruption in their books and clarifying the truth. (Section: Themes of MADANEE Soorahs)"}, {"q": "A soorah contains a verse of prostration (sajdah at-tilaawah). How is it classified?", "opts": ["Madanee", "Makkee", "Disputed", "It cannot be known"], "ans": 1, "exp": "Soorahs with a verse of prostration are all Makkee. (Section: Quick Identification Rules)"}, {"q": "Soorahs mentioning the hypocrites are Madanee, with one exception. Which?", "opts": ["Al-Baqarah", "Aali-'Imraan", "Al-'Ankaboot", "Al-Faatihah"], "ans": 2, "exp": "Soorahs mentioning hypocrites are all Madanee except Soorah al-'Ankaboot. (Section: Quick Identification Rules)"}, {"q": "Stories of previous prophets and the creation of Aadam mark a soorah as Makkee, with one exception. Which?", "opts": ["Aali-'Imraan", "Al-Baqarah", "Al-'Ankaboot", "Al-Faatihah"], "ans": 1, "exp": "Stories of previous prophets and the creation of Aadam are all Makkee except al-Baqarah. (Section: Quick Identification Rules)"}, {"q": "A soorah mentions jihaad in the fighting sense and addresses the Jews. Applying the rules, it is most likely:", "opts": ["Makkee", "Madanee", "Disputed", "Makkee, because it addresses others"], "ans": 1, "exp": "Mention of jihaad in the fighting sense and address to Jews or Christians are both signs of a Madanee soorah. (Section: Quick Identification Rules)"}, {"q": "Which of these soorahs is listed among the 12 disputed soorahs?", "opts": ["Al-Baqarah", "Al-Ikhlaas", "Aali-'Imraan", "Al-'Ankaboot"], "ans": 1, "exp": "The 12 disputed soorahs include al-Faatihah, al-Ikhlaas, al-Falaq and an-Naas. (Section: Quick Identification Rules)"}, {"q": "Which lesson for da'wah comes from knowing Makkee and Madanee?", "opts": ["Begin with laws, then beliefs", "Always begin with Tawheed before laws", "Begin with stories of previous nations", "Begin with dialogue with the People of the Book"], "ans": 1, "exp": "The Makkee-then-Madanee order shows the method for da'wah: always begin with Tawheed before laws. (Section: 6 Benefits of Knowing Makkee and Madanee)"}], "11": [{"q": "What are the two requirements for an event to count as a sabab an-nuzool?", "opts": ["It must be a specific incident or question, and occur shortly before the revelation", "It must be narrated by 'Umar and be in al-Bukhaaree", "It must involve the hypocrites and occur in Madeenah", "It must be a story of a previous nation and be well known"], "ans": 0, "exp": "A sabab an-nuzool must be a specific incident or question, and it must have occurred shortly before the revelation. (Section: What is Sabab an-Nuzool?)"}, {"q": "Which of these can NOT be a sabab an-nuzool?", "opts": ["A question put to the Prophet shortly before a verse", "An incident involving a Companion just before a verse", "Stories of previous nations", "A dispute over war booty"], "ans": 2, "exp": "Stories of previous nations, knowledge of the unseen, and events long before are not asbaab an-nuzool. (Section: What is Sabab an-Nuzool?)"}, {"q": "True or False: Knowledge of the unseen counts as a sabab an-nuzool.", "opts": ["True", "False"], "ans": 1, "exp": "False. Knowledge of the unseen is listed among the things that are NOT a sabab an-nuzool. (Section: What is Sabab an-Nuzool?)"}, {"q": "What is the PRIMARY source of asbaab an-nuzool?", "opts": ["Statements of the Successors", "Hadith from the Prophet ﷺ", "Statements of al-Waahidee", "Stories of previous nations"], "ans": 1, "exp": "The primary source is hadith from the Prophet ﷺ; the secondary source is statements of the Companions who witnessed the revelations. (Section: Sources of Asbaab an-Nuzool)"}, {"q": "Why are the Companions' statements accepted as a source for asbaab an-nuzool?", "opts": ["They wrote the first books on it", "They witnessed the revelations", "They were all Successors", "They lived after the Successors"], "ans": 1, "exp": "The Companions are a secondary source because they witnessed the revelations. (Section: Sources of Asbaab an-Nuzool)"}, {"q": "Which of these is named as a Successor whose reports on asbaab an-nuzool may be accepted?", "opts": ["Mujaahid ibn Jabr", "Ibn Mas'ood", "Jaabir", "Sa'd ibn Abee Waqqaas"], "ans": 0, "exp": "Successors known for accuracy in tafseer, like Mujaahid ibn Jabr, 'Ikrimah, Sa'eed ibn Jubayr and Qataadah, may be accepted. (Section: Sources of Asbaab an-Nuzool)"}, {"q": "For Soorah ad-Duhaa there is a weak narration about a puppy and an authentic one from 'Aa'ishah. What is the rule?", "opts": ["Accept both", "Accept the authentic one and reject the weak", "Accept the more explicit one", "The soorah was revealed twice"], "ans": 1, "exp": "When one narration is weak and one authentic, accept the authentic ('Aa'ishah's, in al-Bukhaaree) and reject the weak. (Section: 4 Rules: When Multiple Causes Exist for One Verse)"}, {"q": "Two equally authentic causes are reported for the li'aan verses (24:6). How are they handled?", "opts": ["The weaker one is rejected", "Both may have applied at the same time", "The verse was revealed twice", "The more explicit one is accepted"], "ans": 1, "exp": "When both are authentic and equal, both may have applied together; for li'aan, two cases were brought at the same time. (Section: 4 Rules: When Multiple Causes Exist for One Verse)"}, {"q": "Verse 9:113 has authentic causes from different times. What does the rule conclude?", "opts": ["Only the earliest is accepted", "The verse may have been revealed more than once", "Both are rejected", "The more explicit one wins"], "ans": 1, "exp": "When both causes are authentic but from different timeframes, the verse may have been revealed more than once, as with 9:113. (Section: 4 Rules: When Multiple Causes Exist for One Verse)"}, {"q": "Which verse was revealed after 'Umar suggested the Prophet's wives wear hijab?", "opts": ["[2:125]", "[33:53]", "[66:5]", "[8:1]"], "ans": 1, "exp": "[33:53] was revealed after 'Umar suggested the hijab for the Prophet's wives. (Section: Famous Examples)"}, {"q": "Which verse is linked to the hunger strike of Sa'd ibn Abee Waqqaas's mother?", "opts": ["[8:1]", "[31:15]", "[59:7]", "[11:114]"], "ans": 1, "exp": "His mother's hunger strike, meant to make him leave Islam, is linked to [31:15]. (Section: Famous Examples)"}, {"q": "Verse [8:1] relates to Sa'd ibn Abee Waqqaas in connection with:", "opts": ["His illness and bequests", "A dispute over war booty", "His drinking habit", "His mother's hunger strike"], "ans": 1, "exp": "Sa'd was the first Muslim to draw a sword, and a dispute over war booty led to [8:1]. (Section: Famous Examples)"}, {"q": "Verse [59:7] was revealed about war booty. According to the key principle, what does it apply to?", "opts": ["Only war booty", "All commands of the Prophet ﷺ", "Only the battle it was revealed about", "Only matters of prayer"], "ans": 1, "exp": "Because the ruling follows the generality of the wording, [59:7] applies to all commands of the Prophet ﷺ; Ibn Mas'ood applied it even to eyebrow plucking. (Section: The Key Principle (Most Important!))"}, {"q": "A man asked whether [11:114] applied only to him. What did the Prophet reply?", "opts": ["\"Yes, only for you\"", "\"No, for all of mankind\"", "\"Only for the Companions\"", "\"Only for those who repent\""], "ans": 1, "exp": "The Prophet replied \"No, for all of mankind\", showing the ruling is not limited to the event. (Section: The Key Principle (Most Important!))"}, {"q": "Verse [111:1] about Aboo Lahab illustrates which benefit of knowing asbaab an-nuzool?", "opts": ["Removes misinterpretations", "Clarifies scope", "Reveals context, such as eternal disgrace for a disbeliever", "Deepens understanding of the wording"], "ans": 2, "exp": "Knowing the context reveals honour for a Companion like 'Umar or eternal disgrace for a disbeliever like Aboo Lahab [111:1]. (Section: 4 Benefits of Knowing Asbaab an-Nuzool)"}]};
const FINAL_QUIZ=[
{q:"What does 'Uloom al-Qur'an mean?",opts:["Laws of the Qur'an","Sciences of the Qur'an","Interpretation of the Qur'an","History of Islam"],ans:1,exp:"'Uloom al-Qur'an = The Sciences of the Qur'an — the collective term for all Islamic fields of knowledge relating to the Qur'an."},
{q:"How many times is Al-Kitab mentioned in the Qur'an?",opts:["4","55","77","140"],ans:2,exp:"Al-Kitab (The Book) is mentioned 77 times in the Qur'an."},
{q:"What is the PRIMARY verse describing the 3 ways Allah communicates with prophets?",opts:["4:163","26:192","42:51","2:185"],ans:2,exp:"[42:51] describes 3 methods: direct wahy, speech from behind a veil, or through an angel (Jibreel)."},
{q:"On which night was the ENTIRE Qur'an sent to the lowest heaven?",opts:["Laylat al-Miraj","Laylat al-Qadr","Laylat al-Bara'ah","Laylat al-Jumu'ah"],ans:1,exp:"Laylat al-Qadr in Ramadaan — [97:1] 'We have sent it down in the Night of Decree.'"},
{q:"The FIRST revelation was the opening verses of which soorah?",opts:["Al-Muddathir","Al-Baqarah","Al-'Alaq","Al-Faatihah"],ans:2,exp:"The first 5 verses of Soorah al-'Alaq (96:1-5) — revealed at Cave of Hiraa, confirmed by 'Aa'ishah in al-Bukhaaree."},
{q:"How many huffaadh (memorizers) were martyred at the Battle of Yamaamah?",opts:["10","40","70","100"],ans:2,exp:"Approximately 70 huffaadh were martyred at Yamaamah — this triggered Aboo Bakr's compilation of the Qur'an into a single book."},
{q:"Who said 'Save this ummah before it disagrees about its Book like Jews and Christians did'?",opts:["'Alee ibn Abee Taalib","Zayd ibn Thaabit","Hudhayfah ibn al-Yamaan","'Umar ibn al-Khattaab"],ans:2,exp:"Hudhayfah ibn al-Yamaan said this to 'Uthmaan — triggering the standardization of the Qur'an into one mus-haf distributed to all provinces."},
{q:"How many ahruf (modes) was the Qur'an revealed in?",opts:["3","5","7","10"],ans:2,exp:"The Qur'an was revealed in 7 ahruf — confirmed by multiple hadith in al-Bukhaaree and Muslim."},
{q:"How many conditions must a Qiraa'a meet to be authentic?",opts:["1","2","3","4"],ans:2,exp:"3 conditions (Ibn al-Jazaree): Arabic grammar + matches Uthmaanic script + authentic mutawaatir chain back to the Prophet."},
{q:"A verse revealed BEFORE the Hijrah is classified as:",opts:["Madanee","Makkee","Disputed","Neither"],ans:1,exp:"Makkee — the strongest (time-based) definition: Makkee = revealed before Hijrah, Madanee = revealed after Hijrah."},
{q:"The KEY PRINCIPLE about asbaab an-nuzool says rulings are based on:",opts:["The specificity of the occasion","The generality of the wording","The scholar's interpretation","The historical context"],ans:1,exp:"'The consideration for a ruling comes from the GENERALITY OF THE WORDING, not the specificity of its circumstance of revelation.'"},
{q:"Approximately how many years did the Prophet live after the LAST verse was revealed?",opts:["9 days","1 month","6 months","1 year"],ans:0,exp:"The Prophet ﷺ lived approximately 9 DAYS after verse 2:281 (the last verse) was revealed — making it very clear this was the final revelation."},
{q:"Which Qaaree's recitation do approximately 95% of Muslims use today?",opts:["Naafi' al-Madanee","'Aasim via his student Hafs","Ibn Katheer al-Makkee","Aboo 'Amr al-Basree"],ans:1,exp:"Hafs 'an 'Aasim — the recitation of Hafs (student of 'Aasim al-Koofee) is used by approximately 95% of the Muslim world."},
{q:"How many soorahs are classified as Madanee?",opts:["12","20","82","114"],ans:1,exp:"20 soorahs are Madanee, 82 are Makkee, and 12 are disputed in classification."},
{q:"True or False: The different ahruf came directly from Allah — they were NOT invented by Companions.",opts:["True","False"],ans:0,exp:"True — the ahruf came from Allah through Jibreel to the Prophet. The Prophet was taught them by Jibreel and then taught different ones to different Companions based on their needs."},

const CHAPTER_ORDER=[1,2,3,4,5,6,8,9,10,11];
let S={

function save(){

function getProg(id){return S.progress['c'+id]||{read:false,qDone:false,qScore:0,qTotal:10}}

function countDone(){return CHAPTER_ORDER.filter(id=>getProg(id).qDone).length}
function allDone(){return CHAPTER_ORDER.every(id=>getProg(id).qDone)}

function render(view,chId,extraState){

  updateNav();
  updateTopbar();
  const el=document.getElementById('content');
  el.className='fade';
  void el.offsetWidth;
  switch(S.view){
    case'home':el.innerHTML=renderHome();break;
    case'chapter':el.innerHTML=renderChapter();if(S.chId)setProg(S.chId,{read:true});break;
    case'quiz':el.innerHTML=renderQuizView();break;
    case'results':el.innerHTML=renderResults();break;
    case'final-intro':el.innerHTML=renderFinalIntro();break;
    case'final-quiz':el.innerHTML=renderQuizView(true);break;
    case'final-results':el.innerHTML=renderFinalResultsView();break;
    case'glossary':el.innerHTML=renderGlossary();break;
  }
  afterRender(el);
  window.scrollTo(0,0);
}

function renderQuizView(isFinal){
  isFinal=isFinal||S.qz.isFinal;
  const{qs,cur,score,answers,done}=S.qz;
  const total=qs.length;
  const q=qs[cur];
  const pct=Math.round((cur/total)*100);
  const chName=isFinal?'Final Comprehensive Quiz':(()=>{const ch=CHAPTERS.find(c=>c.id===S.chId);return ch?`Chapter ${ch.num}: ${ch.title}`:''})();
  const letters=['A','B','C','D'];
  const answered=answers[cur]!==undefined;
  const chosen=answers[cur];
  const opts=q.opts.map((o,i)=>{
    let cls='opt';
    if(answered){
      if(i===q.ans)cls+=' cor';
      else if(i===chosen)cls+=' wrg';
    } else if(i===chosen)cls+=' sel';
    return `<button class="opt${answered?' '+cls.replace('opt','').trim():''}" ${answered?'disabled':''} onclick="answerQ(${i})">
      <span class="opt-l">${letters[i]}</span>${o}
    </button>`;
  }).join('');
  const fb=answered?`<div class="feedback show ${chosen===q.ans?'cor-f':'wrg-f'}">
    <div class="fl">${chosen===q.ans?'✅ Correct!':'❌ Incorrect'}</div>
    ${q.exp}
  </div>`:'';
  const nextBtn=answered?`<div class="qbtn-row"><button class="btn-next" onclick="nextQ()">${cur<total-1?'Next Question →':'See Results'}</button></div>`:'';
  return `<div class="quiz-wrap">
    <div class="quiz-lbl">${chName}</div>
    <div class="quiz-prow">
      <span class="quiz-qc">Q${cur+1} of ${total}</span>
      <div class="quiz-track"><div class="quiz-pfill" style="width:${pct}%"></div></div>
      <span class="quiz-score">${score}/${cur+(answered?1:0)}</span>
    </div>
    <div class="q-card">
      <div class="q-text">${q.text||q.q}</div>
      <div class="opts">${opts}</div>
      ${fb}
      ${nextBtn}
    </div>
  </div>`;
}

function answerQ(i){
  const{qs,cur,answers}=S.qz;
  if(answers[cur]!==undefined)return;
  S.qz.answers[cur]=i;
  if(i===qs[cur].ans)S.qz.score++;
  render(S.view,S.chId);
}

function nextQ(){
  const{qs,cur,isFinal}=S.qz;
  if(cur<qs.length-1){
    S.qz.cur++;
    render(S.view,S.chId);
  } else {
    S.qz.done=true;
    if(isFinal){
      S.finalDone=true;
      S.finalScore=S.qz.score;
      save();
      render('final-results',null);
    } else {
      const pct = Math.round((S.qz.score / qs.length) * 100);
      if (pct >= 60) {
        setProg(S.chId,{qDone:true,qScore:S.qz.score,qTotal:qs.length});
      }
      
      render('results',S.chId);
    }
  }
}

// ============ EXTRAS ============
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bank(id){return (QUIZZES[id]||[]).concat(EXTRA_QUIZZES[id]||[])}
// pick n random questions; shuffle answer order (True/False kept in order)
function drawQuiz(id,n){
  return shuffle(bank(id)).slice(0,n).map(q=>{
    if(q.opts.length<=2)return q;
    const order=shuffle(q.opts.map((_,i)=>i));
    return Object.assign({},q,{opts:order.map(i=>q.opts[i]),ans:order.indexOf(q.ans)});
  });
}
function ringSvg(pct){const r=26,c=2*Math.PI*r;return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line2)" stroke-width="5"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 32 32)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs></svg>`}
let spy=null;
function renderRail(){

  if(S.view==='chapter'){
    const hs=[...document.querySelectorAll('#chBody .sec > h3')];

      `<div class="rail-card"><div class="rail-h">Chapter quiz</div><div class="ring-l">${p.qDone?`Passed · best ${p.qScore}/${p.qTotal}`:`10 random questions from a bank of ${bank(S.chId).length}`}</div><button class="rail-btn" onclick="startQuiz(${S.chId})">${p.qDone?'Retake quiz':'Start quiz'}</button></div>`;

  if(spy)spy.disconnect();

    document.querySelectorAll('#chBody .sec > h3').forEach(h=>spy.observe(h));
  }
}
function continueBtn(){

  if(!id){id=CHAPTER_ORDER.find(i=>!getProg(i).qDone)||null;if(!id)return '';}

const AR_RE=/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF][\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF\s\u200c\u200d.,،:]*/g;
function markArabic(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentElement;if(!p||p.closest('[lang="ar"],[lang="ur"],script,style'))return NodeFilter.FILTER_REJECT;
    AR_RE.lastIndex=0;return AR_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const urdu=n.parentElement.closest('.ur');
    const frag=document.createDocumentFragment();let last=0;const t=n.nodeValue;AR_RE.lastIndex=0;let m;
    while((m=AR_RE.exec(t))){
      const txt=m[0].replace(/\s+$/,'');if(!txt)continue;
      if(m.index>last)frag.append(t.slice(last,m.index));
      const sp=document.createElement('span');sp.lang=urdu?'ur':'ar';sp.dir='rtl';sp.className=urdu?'urt':'art';sp.textContent=txt;frag.append(sp);
      last=m.index+txt.length;
    }
    if(last<t.length)frag.append(t.slice(last));
    n.replaceWith(frag);
  });
}

function buildRecap(){
  const box=document.getElementById('recap');const body=document.getElementById('chBody');
  if(!box||!body)return;
  const hs=[...body.querySelectorAll('.sec > h3')];

  hs.forEach((h,i)=>h.id='sec-'+i);
  box.innerHTML=`<h3>🔑 Key points of this chapter</h3><p>Before the quiz, make sure you can explain each of these:</p><ol>${hs.map((h,i)=>`<li><a href="#sec-${i}" onclick="event.preventDefault();document.getElementById('sec-${i}').scrollIntoView({behavior:'smooth'})">${h.textContent}</a></li>`).join('')}</ol>`;
}
