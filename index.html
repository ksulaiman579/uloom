<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a5e35">
<title>'Uloom al-Qur'an — Study Guide</title>
<style>
/* ===== Glass theme (dark default) ===== */
:root{
  --bg:#060b14;--bg2:#0b1424;
  --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.075);--glass-hi:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#e7edf5;--muted:#8d9bb0;--strong:#ffffff;
  --accent:#2ee6b6;--accent2:#22b8e6;--accent-soft:rgba(46,230,182,.12);--glow:0 0 24px rgba(46,230,182,.28);
  --gold:#f2c14e;--gold-soft:rgba(242,193,78,.12);
  --info:#7aa7ff;--warn:#ff7a85;--ok:#3ddc97;--bad:#ff6b7a;
  --r:18px;--rs:12px;--blur:blur(18px) saturate(140%);
  --sh:0 10px 40px rgba(0,0,0,.35);
  --sb:280px;--rail:280px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Space Grotesk","Inter",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef2f8;--bg2:#e3e9f3;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.9);
  --line:rgba(15,30,60,.09);--line2:rgba(15,30,60,.16);
  --text:#1a2333;--muted:#5d6b80;--strong:#0b1220;
  --accent:#0aa37f;--accent2:#0b84b5;--accent-soft:rgba(10,163,127,.1);--glow:0 0 20px rgba(10,163,127,.18);
  --gold:#b98309;--gold-soft:rgba(185,131,9,.1);
  --info:#2f62d6;--warn:#c9303f;--ok:#14935d;--bad:#c9303f;
  --sh:0 10px 30px rgba(30,50,90,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.7;min-height:100vh;overflow-x:hidden;font-size:16.5px}
button{font-family:inherit;color:inherit}
/* ambient background */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(46,230,182,.16),transparent 70%),
             radial-gradient(35% 30% at 85% 20%,rgba(34,184,230,.14),transparent 70%),
             radial-gradient(45% 40% at 60% 95%,rgba(120,90,255,.10),transparent 70%),var(--bg);
  animation:drift 30s ease-in-out infinite alternate}
:root[data-theme="light"] body::before{background:radial-gradient(40% 35% at 15% 10%,rgba(10,163,127,.14),transparent 70%),radial-gradient(35% 30% at 85% 20%,rgba(11,132,181,.12),transparent 70%),radial-gradient(45% 40% at 60% 95%,rgba(120,90,255,.08),transparent 70%),var(--bg)}
@keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.05)}}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

/* ---- layout ---- */
#app{display:flex;min-height:100vh}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:90}
#overlay.on{display:block}
#sidebar{width:var(--sb);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;display:flex;flex-direction:column;
  background:var(--glass);border-right:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .28s ease;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sb-head{padding:22px 18px 16px;border-bottom:1px solid var(--line)}
.sb-title{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--strong);letter-spacing:.2px}
.sb-title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);margin-right:9px;vertical-align:middle}
.sb-sub{font-size:.72rem;color:var(--muted);margin-top:4px;letter-spacing:.6px;text-transform:uppercase}
#chapterNav{flex:1;padding:10px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:9px 11px;margin-bottom:3px;background:none;border:1px solid transparent;border-radius:var(--rs);text-align:left;cursor:pointer;color:var(--muted);font:inherit;transition:all .15s}
.nav-item:hover{background:var(--glass2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);border-color:rgba(46,230,182,.3);color:var(--strong)}
.nav-num{font-family:var(--display);font-size:.72rem;font-weight:700;min-width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);flex-shrink:0}
.nav-item.active .nav-num{border-color:var(--accent);color:var(--accent)}
.nav-item.done .nav-num{background:var(--accent);border-color:var(--accent);color:#04120d}
.nav-lbl{font-size:.85rem;flex:1;line-height:1.3}
.nav-tick{font-size:.75rem;color:var(--accent)}
.sb-foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.sb-btn,#finalNavBtn{width:100%;min-height:44px;padding:10px;border-radius:var(--rs);font-size:.84rem;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--glass2);color:var(--text);transition:all .15s}
.sb-btn:hover{background:var(--glass-hi)}
#finalNavBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#04120d;font-weight:700}
#finalNavBtn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}

#main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0}
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:0 22px;padding-top:env(safe-area-inset-top);height:calc(60px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 60%,transparent);border-bottom:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#menuBtn{display:none;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-width:44px;min-height:44px;background:none;border:none;cursor:pointer}
#menuBtn span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
#topTitle{font-family:var(--display);font-size:.95rem;font-weight:600;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:var(--glow);transition:width .4s ease}
#topCounter{font-family:var(--display);font-size:.8rem;color:var(--muted);white-space:nowrap}
#themeBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--glass2);cursor:pointer;font-size:1rem;flex-shrink:0}

#shell{display:flex;gap:28px;justify-content:center;padding:28px 32px calc(70px + env(safe-area-inset-bottom));width:100%;max-width:1320px;margin:0 auto}
#content{flex:1;min-width:0;max-width:820px}
#content:focus{outline:none}
#rail{width:var(--rail);flex-shrink:0;display:none}
#rail .rail-in{position:sticky;top:88px;display:grid;gap:14px}
.rail-card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.rail-h{font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.toc a{display:block;padding:6px 10px;margin-left:-10px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:.84rem;line-height:1.4;border-radius:0 8px 8px 0}
.toc a:hover{color:var(--text);background:var(--glass2)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex-shrink:0}
.ring-n{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--strong);line-height:1}
.ring-l{font-size:.78rem;color:var(--muted)}
.rail-btn{width:100%;min-height:44px;margin-top:12px;border-radius:var(--rs);border:none;cursor:pointer;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120d;box-shadow:var(--glow)}
@media(min-width:1200px){#rail{display:block}}

/* ---- home ---- */
.home-bism{text-align:center;font-size:1.6rem;color:var(--accent);margin:6px 0 10px;text-shadow:var(--glow)}
.home-h{text-align:center;font-family:var(--display);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;color:var(--strong);letter-spacing:-.5px;margin-bottom:6px}
.home-sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:26px}
.summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.summary-bar>div{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.stat-n{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--accent);line-height:1.1}
.stat-l{font-size:.72rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.6px}
.continue-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-bottom:18px;padding:14px 18px;border-radius:var(--r);border:1px solid rgba(46,230,182,.35);background:linear-gradient(135deg,rgba(46,230,182,.18),rgba(34,184,230,.12));color:var(--strong);font:inherit;font-weight:600;text-align:left;cursor:pointer;box-shadow:var(--glow);transition:transform .15s}
.continue-btn:hover{transform:translateY(-1px)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ch-card{display:flex;gap:12px;align-items:flex-start;width:100%;padding:16px;text-align:left;font:inherit;cursor:pointer;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:all .2s}
.ch-card:hover{border-color:rgba(46,230,182,.4);background:var(--glass2);transform:translateY(-2px);box-shadow:var(--sh)}
.ch-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;background:var(--glass2);border:1px solid var(--line2)}
.ch-card.done-card .ch-icon{border-color:var(--accent);box-shadow:var(--glow)}
.ch-info{flex:1;min-width:0}
.ch-num-label{font-family:var(--display);font-size:.68rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ch-card-title{font-size:.95rem;font-weight:600;color:var(--strong);line-height:1.3;margin-bottom:3px}
.ch-card-sub{font-size:.8rem;color:var(--muted);line-height:1.4}
.ch-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
.badge.read{color:var(--accent2);border-color:rgba(34,184,230,.35)}
.badge.quiz{color:var(--accent);border-color:rgba(46,230,182,.4);background:var(--accent-soft)}
.btn-start-final{min-height:48px;padding:12px 30px;border-radius:30px;border:none;cursor:pointer;font-weight:700;font-size:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120d;box-shadow:var(--glow)}

/* ---- chapter ---- */
.ch-num-badge{display:inline-block;font-family:var(--display);font-size:.72rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);padding:4px 12px;border-radius:20px;border:1px solid rgba(46,230,182,.35);background:var(--accent-soft);margin-bottom:12px}
.ch-main-title{font-family:var(--display);font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:700;color:var(--strong);letter-spacing:-.5px;line-height:1.15;margin-bottom:8px}
.ch-main-sub{font-size:1rem;color:var(--muted);margin-bottom:18px}
.ch-intro{position:relative;padding:18px 20px 18px 24px;margin-bottom:22px;border-radius:var(--r);background:linear-gradient(135deg,rgba(46,230,182,.10),rgba(34,184,230,.06));border:1px solid rgba(46,230,182,.22);font-size:1.02rem;line-height:1.75;color:var(--text)}
.ch-intro::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent2));box-shadow:var(--glow)}

.sec{position:relative;padding:22px 24px;margin-bottom:16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow-x:auto;scroll-margin-top:84px}
.sec h3{font-family:var(--display);font-size:1.18rem;font-weight:600;color:var(--strong);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);flex-shrink:0}
.sec h4{font-size:.98rem;font-weight:600;color:var(--accent);margin:16px 0 8px}
.sec h5{font-size:.95rem;font-weight:600;color:var(--strong);margin:4px 0 4px}
.sec p{margin-bottom:10px;line-height:1.75}
.sec ul,.sec ol{margin:8px 0 10px 22px;line-height:1.75}
.sec li{margin-bottom:4px}
.sec li::marker{color:var(--accent)}
.sec strong{color:var(--strong);font-weight:600}
.sec em{color:var(--text)}
.sec table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0;font-size:.9rem;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.sec th{background:var(--glass2);color:var(--muted);padding:10px 14px;text-align:left;font-size:.72rem;letter-spacing:.8px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line)}
.sec td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.sec tr:last-child td{border-bottom:none}
.sec tbody tr:hover td,.sec tr:hover td{background:var(--glass2)}

/* callouts: one family, different accent edge + icon */
.cbox,.hbox,.hibox,.tipbox,.warnbox{position:relative;margin:12px 0;padding:14px 16px 14px 18px;border-radius:var(--rs);background:var(--glass2);border:1px solid var(--line);font-size:.95rem;line-height:1.7;color:var(--text)}
.cbox::before,.hbox::before,.hibox::before,.tipbox::before,.warnbox::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c,var(--accent))}
.cbox{--c:var(--accent)}
.cbox strong{color:var(--strong)}
.hbox{--c:var(--accent2);font-style:normal;padding-left:46px}
.hbox::after{content:"\201C";position:absolute;left:14px;top:2px;font-family:Georgia,serif;font-size:2.6rem;line-height:1;color:var(--accent2);opacity:.55}
.hbox .src{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:600;letter-spacing:.4px;color:var(--accent2);padding:2px 10px;border-radius:20px;border:1px solid rgba(34,184,230,.35);background:rgba(34,184,230,.08)}
.hibox{--c:var(--gold)}
.hibox strong{color:var(--gold)}
.tipbox{--c:var(--info)}
.tipbox b{display:block;color:var(--info);font-size:.8rem;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.warnbox{--c:var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent)}

.stages{margin:6px 0;position:relative}
.stage{display:flex;gap:14px;margin-bottom:16px;align-items:flex-start;position:relative}
.stage:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:-14px;width:1px;background:linear-gradient(var(--accent),transparent)}
.stg-n{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.85rem;flex-shrink:0;color:var(--accent);border:1px solid rgba(46,230,182,.4);background:var(--accent-soft)}
.stg-c h5{font-size:1rem;margin-bottom:4px}
.stg-c p{margin-bottom:0}

/* recap */
.recap{margin:20px 0 8px;padding:20px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--gold-soft),transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.recap h3{font-family:var(--display);font-size:1.1rem;color:var(--gold);margin-bottom:6px}
.recap p{font-size:.92rem;color:var(--muted);margin-bottom:10px}
.recap ol{margin-left:22px;line-height:2}
.recap a{color:var(--text);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--gold) 60%,transparent)}
.recap a:hover{color:var(--gold)}

/* quiz call to action + nav */
.quiz-cta{margin-top:22px;padding:28px 24px;text-align:center;border-radius:var(--r);background:linear-gradient(135deg,rgba(46,230,182,.14),rgba(34,184,230,.10));border:1px solid rgba(46,230,182,.3);box-shadow:var(--glow)}
.qcta-icon{font-size:2rem;margin-bottom:6px}
.qcta-title{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--strong);margin-bottom:6px}
.qcta-sub{font-size:.9rem;color:var(--muted);margin-bottom:18px}
.qcta-done{display:inline-flex;gap:6px;padding:6px 16px;border-radius:30px;margin-bottom:10px;font-weight:600;color:var(--accent);border:1px solid rgba(46,230,182,.4);background:var(--accent-soft)}
.btn-quiz{min-height:46px;padding:11px 32px;border-radius:30px;border:none;cursor:pointer;font-weight:700;font-size:.98rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120d;box-shadow:var(--glow);transition:transform .15s}
.btn-quiz:hover{transform:scale(1.03)}
.redo-lnk{background:none;border:none;font:inherit;font-size:.85rem;padding:8px;color:var(--muted);text-decoration:underline;cursor:pointer}
.ch-nav-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-nav,.rbtn{flex:1;min-width:120px;min-height:46px;padding:10px 18px;border-radius:var(--rs);font-size:.9rem;font-weight:600;cursor:pointer;background:var(--glass);border:1px solid var(--line2);color:var(--text);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:all .15s}
.btn-nav:hover,.rbtn:hover{background:var(--glass-hi)}
.btn-nav.pri,.rbtn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#04120d;box-shadow:var(--glow)}

/* quiz */
.quiz-wrap{max-width:720px;margin:0 auto}
.quiz-lbl{font-size:.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quiz-prow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.quiz-qc,.quiz-score{font-family:var(--display);font-size:.85rem;color:var(--muted);flex-shrink:0}
.quiz-score{color:var(--accent);font-weight:700}
.quiz-track{flex:1;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.quiz-pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:var(--glow);transition:width .35s ease}
.q-card{padding:24px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh)}
.q-text{font-family:var(--display);font-size:1.15rem;font-weight:600;color:var(--strong);line-height:1.5;margin-bottom:18px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:12px 14px;border-radius:var(--rs);background:var(--glass2);border:1px solid var(--line);text-align:left;font-size:.95rem;line-height:1.5;cursor:pointer;transition:all .15s}
.opt:hover:not(:disabled){border-color:rgba(46,230,182,.45);background:var(--accent-soft)}
.opt-l{font-family:var(--display);font-size:.75rem;font-weight:700;min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--muted);flex-shrink:0}
.opt.cor{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.cor .opt-l{background:var(--ok);border-color:var(--ok);color:#04120d}
.opt.wrg{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrg .opt-l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px 15px;border-radius:var(--rs);font-size:.92rem;line-height:1.65;border:1px solid var(--line)}
.feedback.show{display:block}

.res-sn{font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--strong);line-height:1}

{id:1,num:"1",title:"Introduction to 'Uloom al-Qur'an",sub:"The Sciences of the Qur'an — an overview",icon:"📚",
intro:"'Uloom al-Qur'an (علوم القرآن) means 'The Sciences of the Qur'an' — a collective term for all Islamic fields of knowledge that relate to the Qur'an. Mastering these sciences is the gateway to truly understanding Allah's final Book.",
content:`
<div class="sec"><h3>What is 'Uloom al-Qur'an?</h3>
<div class="cbox"><strong>'Uloom al-Qur'an</strong> literally means <strong>"The Sciences of the Qur'an."</strong> It is not a single subject — it is an <em>umbrella</em> covering every field of Islamic knowledge that helps us understand the Qur'an.</div>
<p>Think of it as a toolkit. Each tool answers a different question about the Qur'an:</p>
<ul>
<li><strong>How was it revealed?</strong> → al-Wahy (Inspiration)</li>
<li><strong>Why gradually?</strong> → Gradual Revelation</li>
<li><strong>How was it compiled?</strong> → Compilation of the Qur'an</li>
<li><strong>Are there valid different recitations?</strong> → al-Qira'at</li>
<li><strong>What are the 7 modes?</strong> → al-Ahruf</li>
<li><strong>Which verses came from Makkah vs Madeenah?</strong> → Makkee and Madanee</li>
<li><strong>Why were specific verses revealed?</strong> → Asbaab an-Nuzool</li>
</ul>
</div>
<div class="sec"><h3>Why Study it?</h3>
<p>Without these sciences, a person reading the Qur'an can easily:</p>
<ul>
<li>Misunderstand a verse by ignoring its context</li>
<li>Apply a specific ruling universally (or vice versa)</li>
<li>Be confused by different authentic recitations</li>
<li>Miss the rich layers of meaning in the text</li>
</ul>
<div class="hibox"><strong>Ibn Taymiyyah said:</strong> "Knowledge of the causes of revelation produces knowledge of its correct application."</div>
<div class="hibox"><strong>al-Waahidee said:</strong> "It is impossible to properly interpret a verse without reflecting over its context and circumstance."</div>
</div>
<div class="sec"><h3>Historical Development</h3>
<div class="stages">
<div class="stage"><div class="stg-n">1</div><div class="stg-c"><h5>Era of the Companions</h5><p>The Companions practised these sciences naturally — they witnessed the revelations firsthand and knew the context of every verse.</p></div></div>
<div class="stage"><div class="stg-n">2</div><div class="stg-c"><h5>Era of the Successors (Tabi'een)</h5><p>They began documenting what they received from the Companions. Mujaahid, Sa'eed ibn Jubayr, and Qataadah were among the first to record explanations.</p></div></div>
<div class="stage"><div class="stg-n">3</div><div class="stg-c"><h5>Era of Formal Scholarship</h5><p>'Alee al-Madeenee (d.234 AH), teacher of Imaam al-Bukhaaree, wrote the first dedicated book on Asbaab an-Nuzool. Later scholars formalized the entire discipline.</p></div></div>
<div class="stage"><div class="stg-n">4</div><div class="stg-c"><h5>Classical Masterworks</h5><p>Imaam az-Zarkashee (d.794 AH) wrote <em>al-Burhaan fi 'Uloom al-Qur'aan</em>, and as-Suyootee (d.911 AH) wrote the comprehensive <em>al-Itqaan fi 'Uloom al-Qur'aan</em> — still the standard reference today.</p></div></div>
</div>
</div>
<div class="sec"><h3>What This Course Covers</h3>
<p>This guide walks through 10 foundational chapters covering the most essential sciences:</p>
<table><tr><th>#</th><th>Science</th><th>Core Question</th></tr>
<tr><td>2</td><td>The Qur'an</td><td>What are its names and its status?</td></tr>
<tr><td>3</td><td>al-Wahy</td><td>How was revelation delivered?</td></tr>
<tr><td>4</td><td>Gradual Revelation</td><td>Why not all at once?</td></tr>
<tr><td>5</td><td>First &amp; Last Verses</td><td>When did it begin and end?</td></tr>
<tr><td>6</td><td>Compilation</td><td>How was it preserved?</td></tr>
<tr><td>7</td><td>The Ahruf</td><td>Why are there 7 modes?</td></tr>
<tr><td>8</td><td>The Qira'at</td><td>What are the 10 recitations?</td></tr>
<tr><td>9</td><td>Makkee &amp; Madanee</td><td>How do we classify verses?</td></tr>
<tr><td>10</td><td>Asbaab an-Nuzool</td><td>Why were specific verses revealed?</td></tr>
</table>
</div>`},

{id:2,num:"2",title:"The Qur'an",sub:"Names, status, and virtues of Allah's Book",icon:"🌟",
intro:"The Qur'an has multiple names, each revealing a different dimension of its nature. It is the most recited, most memorized, and most preserved book in human history.",
content:`
<div class="sec"><h3>The 5 Primary Names of the Qur'an</h3>
<div class="stages">
<div class="stage"><div class="stg-n">1</div><div class="stg-c"><h5>Al-Qur'an (القرآن) — The Recitation</h5><p>The most common name. From the root <em>qara'a</em> — to read/recite. Preserved in the <strong>hearts</strong> of believers. Mentioned ~70 times in the Qur'an itself.</p></div></div>
<div class="stage"><div class="stg-n">2</div><div class="stg-c"><h5>Al-Kitaab (الكتاب) — The Book</h5><p>Mentioned <strong>77 times</strong>. Emphasises its <strong>written preservation</strong>. [2:1-2] <em>"This is the Book, there is no doubt in it, a guidance for the pious."</em><br><strong>Key distinction:</strong> Qur'an = preserved in hearts; Kitaab = preserved in writing.</p></div></div>
<div class="stage"><div class="stg-n">3</div><div class="stg-c"><h5>Al-Furqaan (الفرقان) — The Criterion</h5><p>Mentioned <strong>4 times</strong>. It is the criterion that distinguishes truth from falsehood, good from evil, tawheed from shirk. [25:1] <em>"Blessed is He who sent down the Criterion to His servant..."</em></p></div></div>
<div class="stage"><div class="stg-n">4</div><div class="stg-c"><h5>Al-Dhikr (الذكر) — The Reminder</h5><p>Mentioned <strong>55 times</strong>. It reminds mankind of their purpose and their Lord. [15:9] <em>"Indeed, it is We who sent down the Reminder, and indeed, it is We who are its Guardian."</em></p></div></div>
<div class="stage"><div class="stg-n">5</div><div class="stg-c"><h5>Al-Tanzeel (التنزيل) — The Revelation</h5><p>Derivatives appear in <strong>140+ verses</strong>. From <em>nazala</em> — to descend from higher to lower. Proof that Allah is <em>above</em> His creation. [26:192] <em>"And truly, this is a revelation from the Lord of the Worlds."</em></p></div></div>
</div>
<div class="tipbox"><b>📝 Note:</b> Imaam az-Zarkashee lists 50+ "names" for the Qur'an — but scholars clarify that most are <em>descriptions and attributes</em>, not actual independent names.</div>
</div>
<div class="sec"><h3>The Qur'an Describing Itself</h3>
<div class="hbox">[10:57] <em>"O mankind! There has come to you good advice from your Lord, and a cure for what is in the breasts, and a guidance and a mercy for the believers."</em></div>
<div class="hbox">[39:23] <em>"Allah has sent down the Best Statement, a Book, its parts resembling each other in goodness and truth..."</em></div>
<div class="hbox">[18:1-2] <em>"Praise be to Allah Who has sent down to His servant the Book, and has not placed therein any crookedness..."</em></div>
</div>
<div class="sec"><h3>Hadith: Status of the Qur'an</h3>
<div class="hbox">"The best of you are those who learn the Qur'an and teach it to others."<div class="src">— Ibn Mas'ood | al-Bukhaaree</div></div>
<div class="hbox">"Allah will raise people by this Book and debase others."<div class="src">— 'Umar ibn al-Khattaab | Muslim</div></div>
<div class="hbox">"The People of the Qur'an are the People of Allah and His Chosen ones."<div class="src">— Anas ibn Maalik | an-Nasaa'ee</div></div>
<div class="hbox">"The Qur'an is an intercessor — an intercession that is accepted, and an opponent whose testimony is accepted. Whoever puts it ahead of him, it leads him to Paradise; and whoever throws it behind his back, it drags him to the Fire."<div class="src">— Ibn Mas'ood | at-Tabaraanee</div></div>
</div>
<div class="sec"><h3>Rewards for Reciting the Qur'an</h3>
<div class="hbox">"The one who is proficient with the Qur'an will be with the honorable and obedient angels, and the one who recites it with difficulty, stammering through it, will have a <strong>double reward</strong>."<div class="src">— 'Aa'ishah | Aboo Daawood</div></div>
<div class="hbox">"Whoever reads one letter from the Book of Allah will have one hasanah, and one hasanah equals ten of its like. I do not say that Alif-Laam-Meem is one letter — rather Alif is a letter, Laam is a letter, and Meem is a letter."<div class="src">— Ibn Mas'ood | at-Tirmidhee</div></div>
<div class="hbox">When a group gathers to recite the Qur'an: <em>"...tranquility descends upon them, mercy covers them, the angels encircle them, and Allah mentions them to those in His presence."</em><div class="src">— Aboo Hurayrah | Aboo Daawood</div></div>
<div class="tipbox"><b>🍊 Beautiful Analogy:</b> The believer who recites = citrus fruit (good smell, good taste). The believer who doesn't recite = dry date (no smell, sweet taste). The hypocrite who recites = basil (nice smell, bitter taste). The hypocrite who doesn't recite = colocynth (no smell, bitter taste). <span style="color:var(--muted)">[Aboo Moosaa al-Ash'aree | Muslim]</span></div>
</div>`},

{id:3,num:"3",title:"Inspiration — al-Wahy",sub:"How Allah communicated with His Prophet",icon:"✨",
intro:"Wahy (وحي) is the divine system Allah used to communicate with the Prophet ﷺ. Understanding it answers: Did Jibreel just whisper? Did the Prophet see him? How exactly did words travel from Allah to mankind?",
content:`
<div class="sec"><h3>What is Wahy?</h3>
<div class="cbox"><strong>Wahy</strong> linguistically means: to inspire, to communicate <em>secretly and swiftly</em>, not in an obvious manner. It implies urgency, hiddenness, and directness.</div>
<div class="hbox">[42:51] <em>"It is not possible for any human being that Allah should speak to him except by revelation (wahy), or from behind a veil, or He sends a messenger (angel) who inspires whatever He wills by His permission. Indeed, He is Exalted and Wise."</em><div class="src">— The Primary Verse on Wahy</div></div>
<p>This verse gives us the <strong>3 ways Allah communicates</strong> with prophets: direct wahy, speech from behind a veil, or through an angel (Jibreel).</p>
</div>
<div class="sec"><h3>7 Linguistic Uses of 'Wahy' in the Qur'an</h3>
<table><tr><th>#</th><th>Type</th><th>Example</th></tr>
<tr><td>1</td><td>Natural laws of nature</td><td>[41:12] Allah "inspired" the heavens with their commands</td></tr>
<tr><td>2</td><td>Animal instinct</td><td>[16:68] "Your Lord inspired the bee..."</td></tr>
<tr><td>3</td><td>Human intuition (ilhaam)</td><td>[28:7] "We inspired the mother of Moosa..."</td></tr>
<tr><td>4</td><td>Signals/gestures</td><td>[19:11] Zakariyyah communicating through hand signals</td></tr>
<tr><td>5</td><td>Evil whispers of Shaytaan</td><td>[6:121] "...the devils do inspire their friends..."</td></tr>
<tr><td>6</td><td>Guidance to angels</td><td>[8:12] "...your Lord inspired the angels..."</td></tr>
<tr><td>7</td><td>Revelation to Prophets</td><td>[4:163] Main subject of this chapter</td></tr>
</table>
</div>
<div class="sec"><h3>Method A: WITHOUT an Intermediary (Direct from Allah)</h3>
<h4>1. Through True Dreams</h4>
<div class="hbox">"The commencement of divine inspiration to the Prophet was in the form of good righteous true dreams in his sleep, like the rising of the sun."<div class="src">— 'Aa'ishah | al-Bukhaaree</div></div>
<div class="warnbox"><strong>Important:</strong> The Prophet NEVER received Qur'anic verses through dreams — this method predated formal prophethood.</div>
<h4>2. Direct Speech from Allah</h4>
<ul>
<li>Allah spoke directly to Moosa on Mount Toor [7:143]</li>
<li>Occurred ONCE with the Prophet ﷺ — during al-Israa wa al-Mi'raaj</li>
<li>The last two verses of Soorah al-Baqarah were revealed this way (strongest opinion)</li>
</ul>
<div class="hbox">"The Prophet was given the five prayers, the last verses of al-Baqarah, and remission of serious sins that do not involve shirk." <div class="src">— Sahih Muslim (173) — on what was received at al-Mi'raaj</div></div>
</div>
<div class="sec"><h3>Method B: WITH Jibreel as Intermediary (Primary Method)</h3>
<p>Jibreel was <em>chosen by Allah</em> [26:192-194] to deliver the Qur'an. The chain: <strong>Allah → Jibreel → Prophet ﷺ → Companions → Us</strong></p>
<div class="hbox">When Allah speaks, the heavens shake severely. The angels fall in swoon. Jibreel is the first to raise his head, then Allah speaks to him with the command. Jibreel then brings it down.<div class="src">— al-Bukhaaree</div></div>
<div class="tipbox"><b>⚡ Imaam Ahmad's conclusion from this hadith:</b> "Therefore the Qur'an is <strong>uncreated</strong>." — Because it is the direct speech of Allah.</div>
<h4>How the Prophet Received it from Jibreel — 2 Ways</h4>
<div class="cbox"><strong>Way 1 — Like the ringing of a bell (hardest):</strong> The Prophet would sweat profusely even on cold nights. When it stopped, he retained every word. [73:5] "We shall send down to you a heavy speech (qawlan thaqeela)."</div>
<div class="cbox"><strong>Way 2 — Jibreel in the form of a man (easier):</strong> The Prophet retained the words easily. Only the Prophet could see Jibreel — Companions saw only a man.</div>
<h4>Jibreel in His Natural Form (600 Wings)</h4>
<p>This occurred only <strong>3 times</strong> with the Prophet ﷺ:</p>
<ol><li>Cave of Hiraa (first revelation)</li><li>A second time shortly after</li><li>The Night of al-Mi'raaj</li></ol>
</div>
<div class="sec"><h3>Ibn al-Qayyim's 7-Type Classification</h3>
<table><tr><th>#</th><th>Type</th><th>Was Qur'an Revealed This Way?</th></tr>
<tr><td>1</td><td>True dreams</td><td>❌ No</td></tr>
<tr><td>2</td><td>Inspiration whispered into heart by angel</td><td>❌ No</td></tr>
<tr><td>3</td><td>Angel in human form speaking</td><td>✅ Yes</td></tr>
<tr><td>4</td><td>Like ringing of a bell</td><td>✅ Yes</td></tr>
<tr><td>5</td><td>Seeing angel in natural form</td><td>✅ Yes</td></tr>
<tr><td>6</td><td>Direct from Allah above 7 skies (Mi'raaj)</td><td>✅ Yes</td></tr>
<tr><td>7</td><td>Direct speech as with Moosa</td><td>✅ Yes (last 2 verses of al-Baqarah)</td></tr>
</table>
</div>`},

{id:4,num:"4",title:"Gradual Revelation",sub:"Why the Qur'an was revealed over 23 years",icon:"📅",
intro:"Unlike previous scriptures revealed all at once, the Qur'an came down gradually over 23 years. This was not a limitation — it was a profound divine wisdom with multiple benefits.",
content:`
<div class="sec"><h3>The Core Question</h3>
<div class="cbox">The disbelievers challenged: <strong>"Why is not the Qur'an revealed all at once?"</strong> [25:32]<br><br>Allah answered: <em>"...Thus (it is sent down in parts) that We may <strong>strengthen your heart</strong> thereby. And We have revealed it to you gradually, in stages."</em></div>
<p>The Qur'an was revealed over <strong>23 years</strong> — 13 years in Makkah and 10 years in Madeenah — in response to real events, questions, and needs of the growing Muslim community.</p>
</div>
<div class="sec"><h3>The 3 Stages of Revelation</h3>
<div class="stages">
<div class="stage"><div class="stg-n">1</div><div class="stg-c">
<h5>Stage 1: Written on the Lauh al-Mahfoodh (Preserved Tablet)</h5>
<p>Before creation itself, Allah recorded all events from the beginning to the Day of Judgement on the Preserved Tablet.</p>
<div class="hbox">"The first thing Allah created was the Pen. He said: 'Write!' It asked: 'What should I write, O Lord?' He said: 'Write the destiny of all things until the Day of Judgement.'"</div>
<p>Evidence: [85:21-22] <em>"Nay! This is indeed a Glorious Qur'an! (Inscribed) in the Lauh al-Mahfoodh."</em></p>
</div></div>
<div class="stage"><div class="stg-n">2</div><div class="stg-c">
<h5>Stage 2: From Lauh al-Mahfoodh → Bayt al-'Izza (lowest heaven) — ALL AT ONCE</h5>
<p>This occurred on <strong>Laylat al-Qadr (Night of Decree)</strong> in the month of <strong>Ramadaan</strong> — the entire Qur'an descended to the "House of Honour" in the lowest heaven, all at once.</p>
<p>Evidence: [2:185] "The month of Ramadaan is the month in which the Qur'an was revealed..." | [97:1] "We have sent it down in the Night of Decree."</p>
</div></div>
<div class="stage"><div class="stg-n">3</div><div class="stg-c">
<h5>Stage 3: From Bayt al-'Izza → Prophet ﷺ through Jibreel — GRADUALLY over 23 years</h5>
<p>Jibreel would bring verses in response to events, questions, and circumstances as they arose.</p>
<p>Evidence: [26:192-194] <em>"And truly this (Qur'an) is a revelation from the Lord of the Worlds, brought down by the trustworthy angel (Jibreel), upon your heart..."</em></p>
</div></div>
</div>
</div>
<div class="sec"><h3>6 Wisdoms of Gradual Revelation</h3>
<table><tr><th>#</th><th>Wisdom</th><th>Evidence/Example</th></tr>
<tr><td>1</td><td><strong>Strengthen the Prophet's resolve</strong></td><td>[25:32, 15:97] Against insults and persecution from disbelievers</td></tr>
<tr><td>2</td><td><strong>Ease memorization for the Companions</strong></td><td>They received 10 verses at a time, memorized AND acted on them before receiving more</td></tr>
<tr><td>3</td><td><strong>Prove the Prophet's truthfulness</strong></td><td>Every question from idolaters/People of the Book got a divine answer [25:33]</td></tr>
<tr><td>4</td><td><strong>Prove its miraculous nature</strong></td><td>6000+ verses over 23 years, zero contradictions [4:82]</td></tr>
<tr><td>5</td><td><strong>Gradually introduce Islamic law</strong></td><td>'Aa'ishah: "If wine was prohibited first, they would have refused!"</td></tr>
<tr><td>6</td><td><strong>Ease the revelation process on the Prophet</strong></td><td>He sweated profusely during revelation — gradual meant less overall burden</td></tr>
</table>
<div class="hbox">"And all of this only shows the concern, and the high status that was given to the Prophet ﷺ."<div class="src">— Ibn Katheer (d.774 AH)</div></div>
</div>`},

{id:5,num:"5",title:"First and Last Revelations",sub:"Where the Qur'an began and where it ended",icon:"🔖",
intro:"The first revelation was the turning point for all of humanity. The last verse sealed a 23-year journey. Scholars examined both carefully, weighing competing narrations.",
content:`
<div class="sec"><h3>The First Revelation — 2 Opinions</h3>
<div class="cbox"><strong>MAJORITY OPINION (Correct):</strong> The first 5 verses of Soorah al-'Alaq [96:1-5]:<br><em>"Read! In the Name of your Lord Who has created (all that exists)..."</em></div>
<h4>The Story: Cave of Hiraa</h4>
<p>The Prophet ﷺ was alone in the Cave of Hiraa when Jibreel came suddenly:</p>
<ol>
<li>Jibreel commanded: <strong>"Read!"</strong></li>
<li>The Prophet replied: <strong>"I am not able to read."</strong></li>
<li>Jibreel embraced and pressed him — THREE times, same reply each time</li>
<li>Then Jibreel recited [96:1-5] and the Prophet repeated after him</li>
<li>The Prophet returned to Khadeejah <strong>trembling</strong>, saying: <em>"Cover me! Cover me!"</em></li>
<li>Khadeejah took him to her cousin <strong>Waraqah ibn Nawfal</strong> (a Christian scholar)</li>
<li>Waraqah confirmed: <em>"This is the angel that Allah sent to Moosa! If only I were young..."</em></li>
</ol>
<div class="cbox"><strong>SECOND OPINION:</strong> Soorah al-Muddathir [74:1] — <em>"O you enveloped (in garments)!"</em><br><br><strong>Reconciliation:</strong> Jaabir ibn 'Abdillaah (who narrated this) was speaking of the first <em>complete soorah</em> revealed — or he only heard the latter part of the story, missing the very beginning.</div>
</div>
<div class="sec"><h3>The Last Revelation — 5 Opinions</h3>
<div class="tipbox"><b>📌 Key Note:</b> No hadith exists where the Prophet explicitly said "this is the FINAL verse I received." So scholars weighed the strongest evidence.</div>
<table><tr><th>Opinion</th><th>Verse</th><th>Evidence</th><th>Strength</th></tr>
<tr><td>1 ✅</td><td>2:281 — "And fear the Day on which you will be returned to Allah..."</td><td>Ibn Abbaas in al-Bukhaaree; Prophet lived only <strong>9 nights</strong> after this</td><td>STRONGEST</td></tr>
<tr><td>2</td><td>2:278 — "Fear Allah and give up what remains of your interest..."</td><td>Another narration from Ibn Abbaas</td><td>Strong</td></tr>
<tr><td>3</td><td>2:282 — "If you contract a debt for a fixed period, write it down..."</td><td>Sa'eed ibn al-Mussayyib</td><td>Moderate</td></tr>
<tr><td>4</td><td>Soorah an-Nasr [110] — Last <em>complete soorah</em> revealed</td><td>Ibn Abbaas in Muslim</td><td>Strong (different category)</td></tr>
<tr><td>5 ❌</td><td>5:3 — "Today I have perfected your religion for you..."</td><td>Commonly believed</td><td>INCORRECT</td></tr>
</table>
<div class="warnbox"><strong>Why 5:3 is NOT the last verse:</strong> It was revealed on the <strong>Day of 'Arafah</strong> at the Farewell Pilgrimage — several months BEFORE the Prophet's death. It refers to the completion of halaal/haraam laws, NOT the end of all revelation.</div>
<div class="hibox"><strong>as-Suyootee's reconciliation of opinions 1-3:</strong> "There is no contradiction — all three were revealed <em>together at the same time</em>." (They are all from the same passage, 2:278-282.)</div>
</div>`},

{id:6,num:"6",title:"Compilation of the Qur'an",sub:"Three stages of preservation — from memory to standard text",icon:"📜",
intro:"No other religious book in history has been preserved with the care and rigor applied to the Qur'an. Its compilation unfolded in three distinct historical stages, each addressing a specific need.",
content:`
<div class="sec"><h3>Allah's Promise of Preservation</h3>
<div class="hbox">[15:9] <em>"Indeed, it is We who sent down the Reminder (Dhikr), and indeed, it is We who are its Guardian."</em></div>
<p>This was not just a promise — it was fulfilled through three precise historical stages.</p>
</div>
<div class="sec"><h3>Stage 1: During the Prophet's Lifetime ﷺ</h3>
<h4>Memorization</h4>
<p>Famous memorizers among the Companions included: Aboo Bakr, 'Umar, 'Uthmaan, 'Alee, Ibn Mas'ood, Ibn 'Amr, Ibn 'Abbaas, Ubay ibn Ka'ab, Mu'aadh ibn Jabal, Zayd ibn Thaabit.</p>
<h4>Writing</h4>
<p>The Prophet ﷺ dictated to designated scribes. Materials used: <em>shoulder bones, smooth stones, date-palm leaves, saddles, leather</em>.</p>
<div class="hbox">"We used to compile the Qur'an from scraps of leather."<div class="src">— Zayd ibn Thaabit</div></div>
<h4>Why NOT compiled into one book during the Prophet's lifetime? (4 Reasons)</h4>
<ol>
<li>No pressing need — memory was sufficient and reliable</li>
<li>Revelation was still <em>continuing</em> (last verse came only 9 days before his death)</li>
<li>Arrangement was non-chronological (required divine guidance)</li>
<li>Some revelations were still being abrogated</li>
</ol>
</div>
<div class="sec"><h3>Stage 2: Aboo Bakr's Compilation (12 AH)</h3>
<div class="cbox"><strong>The Trigger:</strong> At the <strong>Battle of Yamaamah</strong>, approximately <strong>70 huffaadh (memorizers)</strong> were martyred. 'Umar became alarmed: <em>"What if more memorizers die?"</em></div>
<h4>The Process</h4>
<ul>
<li>'Umar urged Aboo Bakr to compile. Aboo Bakr hesitated: <em>"How can I do what the Prophet did not do?"</em></li>
<li>'Umar convinced him: this is <em>maslaha</em> (public benefit), not <em>bid'ah</em> (forbidden innovation)</li>
<li><strong>Zayd ibn Thaabit</strong> was appointed as compiler — he set strict criteria:</li>
</ul>
<div class="hibox"><strong>Zayd's Double-Verification Rule:</strong> Required <em>at least 2 people</em> who learned directly from the Prophet + <em>at least 1 written copy</em> supervised by the Prophet.</div>
<ul>
<li>'Umar stood in the mosque: <em>"Whoever has learnt any Qur'an from the Prophet, bring it forth."</em></li>
<li>The result: the first complete mus-haf, kept with Aboo Bakr → 'Umar → <strong>Hafsah</strong> (daughter of 'Umar)</li>
</ul>
<div class="hbox">"The person with the greatest rewards regarding the mus-haf is Aboo Bakr."<div class="src">— 'Alee ibn Abee Taalib</div></div>
</div>
<div class="sec"><h3>Stage 3: 'Uthmaan's Standardization (24-25 AH)</h3>
<div class="cbox"><strong>The Trigger:</strong> Muslims in Armenia and Azerbaijan were fighting over their recitations. Syrians recited differently from Iraqis. Arguments broke out — some even said "My recitation is better than yours!"</div>
<div class="hbox">"Save this ummah before it disagrees about its Book like the Jews and Christians did!"<div class="src">— Hudhayfah ibn al-Yamaan, to 'Uthmaan</div></div>
<h4>'Uthmaan's Solution: 4-Man Committee</h4>
<ol>
<li>Zayd ibn Thaabit (main compiler)</li>
<li>'Abdullaah ibn az-Zubayr</li>
<li>Sa'eed ibn al-'Aas</li>
<li>'Abd al-Rahmaan ibn al-Haarith</li>
</ol>
<p><strong>Instruction:</strong> "If you differ in spelling, use the dialect of <strong>Quraysh</strong> — for the Qur'an was revealed in their tongue."</p>
<h4>Copies Distributed to Provinces</h4>
<table><tr><th>Province</th><th>Reciter Sent With It</th></tr>
<tr><td>Madeenah</td><td>Zayd ibn Thaabit</td></tr>
<tr><td>Makkah</td><td>'Abdullaah ibn Saa'ib</td></tr>
<tr><td>Syria</td><td>al-Mugheerah ibn Shu'bah</td></tr>
<tr><td>Koofah</td><td>Aboo 'Abd ar-Rahmaan as-Sulamee</td></tr>
<tr><td>Basrah</td><td>Aamir ibn 'Abd al-Qays</td></tr>
</table>
<p>All other non-standard copies were destroyed. This unified the ummah on one reading.</p>
<div class="hbox">"If I were in charge when 'Uthmaan had been, I would have done the same."<div class="src">— 'Alee ibn Abee Taalib</div></div>
<div class="tipbox"><b>📌 Ibn Taymiyyah's summary:</b> The final recitation = Zayd ibn Thaabit's recitation; recited to Jibreel in the last year of the Prophet's life; Aboo Bakr was first to compile it; 'Uthmaan standardized and distributed it with the Companions' approval.</div>
</div>`},

{id:8,num:"7",title:"The Ahruf of the Qur'an",sub:"Why the Qur'an was revealed in 7 modes",icon:"🔤",
intro:"The Qur'an was revealed in 7 ahruf (modes/forms). This was a mercy from Allah — making recitation accessible to people of different dialects. Understanding this resolves confusion about 'different versions.'",
content:`
<div class="sec"><h3>What are the Ahruf?</h3>
<div class="cbox"><strong>Ahruf</strong> (singular: <em>harf</em>) — the various ways certain verses of the Qur'an can validly be read. <strong>NOT</strong> different Qur'ans, NOT different meanings — rather different valid pronunciations and word choices for the same revelation.<br><br>Imaam al-Qurtubee: <em>"Every variation of a word in the Qur'an is a harf."</em></div>
</div>
<div class="sec"><h3>3 Hadith Proving the Qur'an Was Revealed in 7 Ahruf</h3>
<div class="hbox"><strong>Hadith 1:</strong> Ibn Abbaas narrated: Jibreel recited the Qur'an to me in one harf. I asked him to increase. He increased until we reached seven ahruf. Ibn Shihaab az-Zuhree added: <em>"These seven ahruf are essentially one in meaning; they do not differ about what is permitted or what is forbidden."</em><div class="src">al-Bukhaaree and Muslim</div></div>
<div class="hbox"><strong>Hadith 2:</strong> 'Umar heard Hishaam ibn Hakeem reciting Soorah al-Furqaan differently from how the Prophet taught <em>him</em>. 'Umar grabbed Hishaam and brought him to the Prophet. The Prophet listened to BOTH and said: <em>"Both are correct. The Qur'an has been revealed in seven different ahruf — so recite whichever is easy for you."</em><div class="src">al-Bukhaaree and Muslim</div></div>
<div class="hbox"><strong>Hadith 3:</strong> Ubay ibn Ka'ab reported the Prophet said: <em>"I have been sent to an illiterate nation... among them are those who have never read any writing!"</em> Jibreel answered: <em>"The Qur'an has been revealed in seven ahruf."</em><div class="src">at-Tirmidhee</div></div>
</div>
<div class="sec"><h3>4 Key Conclusions from These Narrations</h3>
<ol>
<li>The different ahruf are <strong>directly from Allah</strong> — not from the Companions</li>
<li>Multiple ahruf were given to <strong>ease memorization and recitation</strong> for the ummah</li>
<li>The Prophet taught <strong>different ahruf to different Companions</strong> based on their needs</li>
<li>Each harf is <strong>complete and valid in and of itself</strong></li>
</ol>
</div>
<div class="sec"><h3>What Do the 7 Ahruf Actually Mean? (Strongest Opinion)</h3>
<p>There are many scholarly opinions. The <strong>strongest</strong> (held by Ibn Qutaybah, al-Baaqillaanee, Ibn al-Jazaree) is that the 7 ahruf represent <strong>7 types/categories of variation</strong>:</p>
<table><tr><th>#</th><th>Type of Variation</th><th>Example</th></tr>
<tr><td>1</td><td>Change in wording (different roots/words)</td><td>Synonymous words allowed</td></tr>
<tr><td>2</td><td>Differences in letters (within Uthmaanic script)</td><td><em>maaliki / maliki</em> in al-Faatihah 1:4</td></tr>
<tr><td>3</td><td>Change in word order</td><td>[3:195] different arrangements</td></tr>
<tr><td>4</td><td>Addition or subtraction of a letter/word</td><td>[57:24] variations</td></tr>
<tr><td>5</td><td>Form/structure change (plural/singular, gender)</td><td>[23:8] variations</td></tr>
<tr><td>6</td><td>Differences in inflection points</td><td>[2:125] variations</td></tr>
<tr><td>7</td><td>Differences in pronunciation (tashheel, imaalah)</td><td>Accent/phonetic variations</td></tr>
</table>
<div class="tipbox"><b>📌 Ibn al-Jazaree's conclusion:</b> "The Uthmaanic mus-hafs contain all seven ahruf — not a single letter is missing." The 10 authentic qira'aat together express all variations of the 7 ahruf.</div>
</div>`},

{id:9,num:"8",title:"The Qira'at of the Qur'an",sub:"The 10 authentic modes of recitation",icon:"🎙️",
intro:"The qira'at are the 10 authenticated systems of reciting the Qur'an, each named after a master reciter with an unbroken chain back to the Prophet ﷺ. They are not different Qur'ans — they are preserved variations within the ahruf.",
content:`
<div class="sec"><h3>What are the Qira'at?</h3>
<div class="cbox"><strong>Qiraa'at</strong> (singular: <em>qiraa'a</em>): The various authenticated ways of reciting the Qur'an. Each qiraa'a has its own tajweed rules and is named after a master <em>Qaaree</em> (reciter). Each Qaaree has 2 main students called <em>Raawis</em>.<br><br><em>"The recitation of the Qur'an is a Sunnah; the later generations must take it from the earlier ones."</em> — 'Umar ibn al-Khattaab</div>
</div>
<div class="sec"><h3>3 Conditions for an Authentic Qiraa'a (Ibn al-Jazaree, d.832 AH)</h3>
<ol>
<li>Conforms to the rules of <strong>Arabic grammar</strong></li>
<li>Matches at least one of the <strong>Uthmaanic mus-hafs</strong></li>
<li>Has an <strong>authentic mutawaatir chain</strong> of narrators back to the Prophet ﷺ</li>
</ol>
<p>All 3 conditions must be met. If any one is missing, the reading is NOT a valid qiraa'a.</p>
</div>
<div class="sec"><h3>4 Types of Qira'at</h3>
<table><tr><th>Type</th><th>Meets Which Conditions</th><th>Status</th></tr>
<tr><td><strong>Saheeh</strong> (Authentic)</td><td>All 3</td><td>✅ Valid — this is Qur'an</td></tr>
<tr><td><strong>Shaadh</strong> (Irregular)</td><td>Grammar + Chain — but NOT Uthmaanic script; NOT mutawaatir</td><td>❌ NOT Qur'an; may be studied as tafseer</td></tr>
<tr><td><strong>Da'eef</strong> (Weak)</td><td>Grammar + Uthmaanic script — but NO authentic chain</td><td>❌ NOT Qur'an</td></tr>
<tr><td><strong>Baatil</strong> (False)</td><td>None</td><td>❌ NOT Qur'an — completely rejected</td></tr>
</table>
<div class="warnbox"><strong>Ruling:</strong> It is <strong>haraam</strong> to treat Shaadh, Da'eef, or Baatil readings as Qur'an. Prayer with such readings is <strong>invalid</strong>.</div>
</div>
<div class="sec"><h3>The 10 Authentic Qaarees</h3>
<table><tr><th>Qaaree</th><th>City</th><th>Died</th><th>Key Raawi</th></tr>
<tr><td>1. Naafi' al-Madanee</td><td>Madeenah</td><td>169 AH</td><td>Qaloon, <strong>Warsh</strong></td></tr>
<tr><td>2. Ibn Katheer al-Makkee</td><td>Makkah</td><td>120 AH</td><td>al-Buzzee, Qumbul</td></tr>
<tr><td>3. Aboo 'Amr al-Basree</td><td>Basrah</td><td>154 AH</td><td>ad-Dooree, as-Soosee</td></tr>
<tr><td>4. Ibn 'Aamir ash-Shaamee</td><td>Damascus</td><td>118 AH</td><td>Hishaam, Ibn Dhakwaan</td></tr>
<tr><td>5. 'Aasim al-Koofee</td><td>Koofah</td><td>127 AH</td><td>Shu'ba, <strong>Hafs</strong></td></tr>
<tr><td>6. Hamzah al-Koofee</td><td>Koofah</td><td>156 AH</td><td>Khalaf, Khallaad</td></tr>
<tr><td>7. al-Kisaa'ee</td><td>Baghdad</td><td>189 AH</td><td>al-Layth, ad-Dooree</td></tr>
<tr><td>8. Aboo Jaa'far al-Madanee</td><td>Madeenah</td><td>130 AH</td><td>Ibn Wardaan, Ibn Jammaaz</td></tr>
<tr><td>9. Ya'qoob al-Basree</td><td>Basrah</td><td>205 AH</td><td>Ruways, Rooh</td></tr>
<tr><td>10. Khalaf al-'Aashir</td><td>Baghdad</td><td>229 AH</td><td>Ishaaq, Idrees</td></tr>
</table>
<div class="tipbox"><b>🌍 Distribution Today:</b> <strong>Hafs 'an 'Aasim</strong> (~95% of Muslim world) | <strong>Warsh 'an Naafi'</strong> (~3% — Algeria, Morocco, West Africa) | <strong>Qaloon 'an Naafi'</strong> (~0.7% — Libya, Tunisia) | <strong>Ibn 'Aamir</strong> (~1% — parts of Yemen)</div>
</div>
<div class="sec"><h3>Example: How Different Qira'at Add Meaning</h3>
<div class="cbox"><strong>Al-Faatihah 1:4</strong><br>• <em>Maaliki</em> (Owner) — Naafi', Ibn Katheer<br>• <em>Maliki</em> (King) — 'Aasim, others<br>Together they give us: Allah is both the King AND the Owner of the Day of Judgement.</div>
<div class="cbox"><strong>Ablution verse — Al-Maa'idah 5:6</strong><br>• <em>Arjulakum</em> (accusative) → wash your feet<br>• <em>Arjulikum</em> (genitive) → wipe over your feet<br>No contradiction! One applies when wearing leather socks (wipe), the other for bare feet (wash).</div>
</div>
<div class="sec"><h3>5 Benefits of the Different Qira'at</h3>
<ol>
<li>Facilitation of memorization for different peoples</li>
<li>Proof the Qur'an is from Allah — thousands of variations, none contradictory</li>
<li>Proof of exact preservation — all chains are mutawaatir</li>
<li>Indication of miraculous nature — adds layers of meaning</li>
<li>Removes stagnation — the sacred text remains vibrant</li>
</ol>
</div>`},

{id:10,num:"9",title:"The Makkee and the Madanee",sub:"Classifying verses before and after the Hijrah",icon:"🕌",
intro:"The Qur'an was revealed over two distinct phases: Makkah (13 years) and Madeenah (10 years). Each phase addressed different needs — building faith first, then establishing society.",
content:`
<div class="sec"><h3>3 Definitions — Which is Correct?</h3>
<table><tr><th>Definition</th><th>Makkee</th><th>Madanee</th><th>Problem?</th></tr>
<tr><td>1 ✅ <strong>TIME-BASED (Strongest)</strong></td><td>Revealed BEFORE the Hijrah</td><td>Revealed AFTER the Hijrah</td><td>None — covers all cases</td></tr>
<tr><td>2 — Place-based</td><td>Revealed IN Makkah</td><td>Revealed IN Madeenah</td><td>Can't classify verses revealed elsewhere (Tabook, Jerusalem, etc.)</td></tr>
<tr><td>3 — Addressee-based</td><td>Addresses Quraysh/polytheists</td><td>Addresses Muslims/hypocrites</td><td>Many verses address all mankind or People of the Book</td></tr>
</table>
<div class="hibox"><strong>Practical Example of Definition 1:</strong> The verse 5:3 ("Today I have perfected your religion...") was revealed during the Farewell Pilgrimage <em>in Makkah</em> but is classified as <strong>MADANEE</strong> — because it was revealed AFTER the Hijrah.</div>
</div>
<div class="sec"><h3>Themes of MAKKEE Soorahs</h3>
<ol>
<li><strong>Pure Tawheed</strong> — affirming Allah's Names and Attributes, rejecting false deities</li>
<li><strong>Core beliefs ('Aqeedah)</strong> — prophethood, angels, scriptures, Day of Judgement, Heaven and Hell</li>
<li><strong>Morality and character</strong> — broad principles: care for orphans, no female infanticide; <em>no specific legal rulings yet</em></li>
<li><strong>Stories of previous nations</strong> — encouragement for the believers, warnings for the disbelievers</li>
</ol>
</div>
<div class="sec"><h3>Themes of MADANEE Soorahs</h3>
<ol>
<li><strong>Detailed worship laws</strong> — prayer, zakaah, fasting, pilgrimage specifics</li>
<li><strong>System of laws</strong> — jihaad, marriage, inheritance, governance, hudood punishments</li>
<li><strong>Dialogue with Jews and Christians</strong> — exposing corruption in their books, clarifying truth</li>
<li><strong>Exposing hypocrites</strong> — hypocrisy was a Madeenah phenomenon (they pretended to be Muslim)</li>
</ol>
</div>
<div class="sec"><h3>Quick Identification Rules</h3>
<h4>A verse/soorah is MAKKEE if it has:</h4>
<ul>
<li>The word <em>"Kalaa"</em> (Nay!) — appears in 15+ soorahs, all Makkee</li>
<li>Disjointed letters (Alif-Lam-Meem, Ha-Meem, etc.) — ALL Makkee EXCEPT al-Baqarah and Aali-'Imraan</li>
<li>A verse of prostration (<em>sajdah at-tilaawah</em>) — ALL Makkee</li>
<li>Stories of previous prophets and creation of Aadam — ALL Makkee EXCEPT al-Baqarah</li>
<li>Short, concise verses with strong words and frequent oaths</li>
</ul>
<h4>A verse/soorah is MADANEE if it has:</h4>
<ul>
<li>Mention of <em>hudood</em> (prescribed punishments)</li>
<li>Mention of hypocrites — ALL Madanee EXCEPT Soorah al-'Ankaboot</li>
<li>Address to Jews and/or Christians</li>
<li>Mention of jihaad (in the fighting sense)</li>
<li>Generally longer verses</li>
</ul>
<div class="cbox"><strong>Classification of all 114 Soorahs:</strong><br>• <strong>Makkee:</strong> 82 soorahs<br>• <strong>Madanee:</strong> 20 soorahs<br>• <strong>Disputed:</strong> 12 soorahs (including al-Faatihah, al-Ikhlaas, al-Falaq, an-Naas)</div>
</div>
<div class="sec"><h3>6 Benefits of Knowing Makkee and Madanee</h3>
<ol>
<li><strong>Essential for proper tafseer</strong> — you can't interpret without knowing the context</li>
<li><strong>Helps identify abrogated verses</strong> — Madanee takes precedence when there is conflict</li>
<li><strong>Insight into the Prophet's life</strong> — Makkee: patience under persecution; Madanee: beware of hypocrites</li>
<li><strong>Shows gradual introduction of Sharee'ah</strong> — 'Aqeedah first, then laws</li>
<li><strong>Methodology for da'wah</strong> — always begin with Tawheed before laws</li>
<li><strong>Proves the detail in preserving the Qur'an</strong></li>
</ol>
</div>`},

{id:11,num:"10",title:"Causes of Revelation",sub:"Asbaab an-Nuzool — why specific verses were sent down",icon:"🔍",
intro:"Asbaab an-Nuzool (أسباب النزول) are the specific events that directly caused particular verses to be revealed. Knowing them prevents misapplication and unlocks deeper understanding.",
content:`
<div class="sec"><h3>What is Sabab an-Nuzool?</h3>
<div class="cbox"><strong>Sabab an-Nuzool</strong> (plural: <em>asbaab an-nuzool</em>): A specific event or question that was the <em>direct, immediate cause</em> of a particular verse being revealed.<br><br><strong>Two requirements:</strong><ol><li>Must be a specific incident or question</li><li>Must have occurred <em>shortly before</em> the revelation</li></ol></div>
<div class="tipbox"><b>📌 Important:</b> MOST of the Qur'an was revealed WITHOUT a specific asbaab an-nuzool. Allah revealed guidance proactively — not only in response to events.</div>
<div class="warnbox"><strong>What is NOT a sabab an-nuzool:</strong><br>• Stories of previous nations<br>• Knowledge of the unseen<br>• Events that occurred long before (e.g., Abrahah's attack on the Ka'bah is NOT the sabab for Soorah al-Feel — it happened years earlier)</div>
</div>
<div class="sec"><h3>Sources of Asbaab an-Nuzool</h3>
<p><strong>Primary:</strong> Hadith from the Prophet ﷺ<br><strong>Secondary:</strong> Statements from Companions (who witnessed the revelations)</p>
<div class="hbox">"It is not permitted to speak about asbaab an-nuzool except by transmitting reports from those who witnessed the revelation and were present when it occurred."<div class="src">— al-Waahidee (d.487 AH)</div></div>
<p>Successors (tabi'een) known for accuracy in tafseer may also be accepted: Mujaahid ibn Jabr (d.103 AH), 'Ikrimah (d.104 AH), Sa'eed ibn Jubayr (d.95 AH), Qataadah as-Sadoosee (d.110 AH).</p>
</div>
<div class="sec"><h3>4 Rules: When Multiple Causes Exist for One Verse</h3>
<table><tr><th>Situation</th><th>Rule</th><th>Example</th></tr>
<tr><td>One weak + one authentic</td><td>Accept authentic, reject weak</td><td>Soorah ad-Duhaa: Accept 'Aa'ishah's narration (al-Bukhaaree), reject the weak one about a puppy</td></tr>
<tr><td>Both authentic — one more explicit</td><td>Accept the more explicit one</td><td>2:223: Accept Jaabir's explicit narration over Ibn 'Umar's ambiguous one</td></tr>
<tr><td>Both authentic and equal</td><td>Both may have been simultaneously applicable</td><td>Verses of li'aan (24:6): Two cases brought at the same time</td></tr>
<tr><td>Both authentic, different timeframes</td><td>Verse may have been revealed MORE THAN ONCE</td><td>9:113: Revealed about three separate incidents involving prayer for polytheists</td></tr>
</table>
</div>
<div class="sec"><h3>Famous Examples</h3>
<h4>'Umar's 3 "Agreements with His Lord"</h4>
<ul>
<li>[2:125] — 'Umar suggested making Maqaam Ibrahim a place of prayer → verse was revealed confirming it</li>
<li>[33:53] — 'Umar suggested the Prophet's wives wear hijab → verse revealed</li>
<li>[66:5] — 'Umar warned the Prophet's wives → verse revealed</li>
</ul>
<h4>Sa'd ibn Abee Waqqaas — 4 Verses About Him</h4>
<ol>
<li>His mother's hunger strike (to make him leave Islam) → [31:15]</li>
<li>First Muslim to draw a sword; dispute over war booty → [8:1]</li>
<li>His illness and question about bequests → bequest verse</li>
<li>His drinking habit → wine prohibition verse</li>
</ol>
</div>
<div class="sec"><h3>The Key Principle (Most Important!)</h3>
<div class="hibox"><strong>MAJORITY VIEW (Correct):</strong><br><em>"The consideration for a ruling comes from the <strong>GENERALITY OF THE WORDING</strong>, not the specificity of its circumstance of revelation."</em><br><br>This means: even if a verse was revealed for ONE specific event, its ruling applies to ALL similar situations.</div>
<div class="cbox"><strong>Example:</strong> [59:7] "Whatever the Messenger gives you, take it..." — revealed specifically about war booty, but applies to <em>ALL</em> commands of the Prophet ﷺ. Ibn Mas'ood confirmed this applies even to prohibitions like eyebrow plucking.</div>
<div class="cbox"><strong>Another Example:</strong> [11:114] "Establish prayer at the two ends of the day..." — A man asked if this verse only applied to him after he kissed a non-mahram woman. The Prophet replied: <em>"No, for all of mankind."</em></div>
</div>
<div class="sec"><h3>4 Benefits of Knowing Asbaab an-Nuzool</h3>
<ol>
<li><strong>Removes misinterpretations</strong> — context prevents wrong application of verses</li>
<li><strong>Deepens understanding</strong> — knowing what prompted a verse makes it more meaningful</li>
<li><strong>Clarifies scope</strong> — when general or specific application is intended</li>
<li><strong>Reveals context of revelation</strong> — honor for a Companion (like 'Umar) or eternal disgrace for a disbeliever (like Aboo Lahab [111:1])</li>
</ol>
</div>`}
];
