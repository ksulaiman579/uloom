const GLOSSARY=[
{term:"'Uloom al-Qur'an",ar:"علوم القرآن",mean:"The Sciences of the Qur'an: an umbrella for every field of Islamic knowledge that helps us understand the Qur'an.",ch:1},
{term:"Al-Qur'an",ar:"القرآن",mean:"The Recitation. From qara'a, to read or recite. Preserved in the hearts of believers.",ch:2},
{term:"Al-Kitaab",ar:"الكتاب",mean:"The Book. Emphasises its written preservation.",ch:2},
{term:"Al-Furqaan",ar:"الفرقان",mean:"The Criterion, which distinguishes truth from falsehood.",ch:2},
{term:"Al-Dhikr",ar:"الذكر",mean:"The Reminder of mankind's purpose and their Lord.",ch:2},
{term:"Al-Tanzeel",ar:"التنزيل",mean:"The Revelation. From nazala, to descend from higher to lower.",ch:2},
{term:"Wahy",ar:"وحي",mean:"Linguistically: to inspire, to communicate secretly and swiftly. The divine system Allah used to communicate with the Prophet ﷺ.",ch:3},
{term:"Mus-haf",ar:"",mean:"A written copy of the Qur'an. Aboo Bakr compiled the first complete mus-haf; 'Uthmaan sent standard copies to the provinces.",ch:6},
{term:"Harf / Ahruf",ar:"",mean:"The various valid ways certain verses can be read. Not different Qur'ans or meanings. The Qur'an was revealed in 7 ahruf.",ch:8},
{term:"Qiraa'a / Qiraa'aat",ar:"",mean:"The authenticated ways of reciting the Qur'an, each with its own tajweed rules, named after a master reciter.",ch:9},
{term:"Qaaree",ar:"",mean:"A master reciter after whom a qiraa'a is named.",ch:9},
{term:"Raawi",ar:"",mean:"One of the two main students of each Qaaree.",ch:9},
{term:"Mutawaatir",ar:"",mean:"A chain of narration so widely transmitted it is certain. Required for an authentic qiraa'a.",ch:9},
{term:"Makkee",ar:"",mean:"Revealed before the Hijrah (the strongest of the three definitions).",ch:10},
{term:"Madanee",ar:"",mean:"Revealed after the Hijrah, even if revealed in Makkah (e.g. 5:3).",ch:10},
{term:"Sabab / Asbaab an-Nuzool",ar:"أسباب النزول",mean:"A specific event or question that directly caused a verse to be revealed, shortly before it.",ch:11}
];
function buildGlossary(){return GLOSSARY}
function showGlossary(){closeSidebar();render('glossary',null);}
function renderGlossary(){
  const g=buildGlossary();
  return `<div class="gloss">
    <h2 class="ch-main-title">Glossary of Terms</h2>
    <p class="ch-main-sub">Key terms used in this guide. Tap a chapter to read where it is explained.</p>
    <input id="glossQ" class="gloss-q" type="search" placeholder="Search terms…" oninput="filterGloss(this.value)" aria-label="Search glossary">
    <div id="glossList">${g.map(x=>{const ch=CHAPTERS.find(c=>c.id===x.ch);return `<div class="g-item" data-k="${(x.term+' '+x.mean).toLowerCase()}">
      <div class="g-top"><span class="g-term">${x.term}</span>${x.ar?`<span class="g-ar">${x.ar}</span>`:''}</div>
      ${x.mean?`<div class="g-mean">${x.mean}</div>`:''}
      <button class="g-ch" onclick="goChapter(${x.ch})">Chapter ${ch.num}: ${ch.title}</button></div>`}).join('')}</div>
    <div class="ch-nav-row"><button class="btn-nav" onclick="render('home')">🏠 Home</button></div>
  </div>`;
}
function filterGloss(q){q=q.toLowerCase().trim();document.querySelectorAll('.g-item').forEach(el=>{el.style.display=!q||el.dataset.k.includes(q)?'':'none'})}

function afterRender(el){
  if(S.view==='chapter')buildRecap();
  renderRail();
  markArabic(el);
  markArabic(document.getElementById('topTitle'));
}

// Theme
function applyTheme(t){
  if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  t=t||'dark';document.documentElement.setAttribute('data-theme',t);const dark=t==='dark';
  document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').content=dark?'#060b14':'#eef2f8';
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  const nxt=cur==='dark'?'light':'dark';safeStorage.setItem('uaq_theme',nxt);applyTheme(nxt);
}
applyTheme(safeStorage.getItem('uaq_theme'));


// Keyboard: ← → between chapters, Esc closes menu
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSidebar();return;}
  if(e.target.matches('input,textarea')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(S.view!=='chapter')return;
  const i=CHAPTER_ORDER.indexOf(S.chId);
  if(e.key==='ArrowRight'&&i<CHAPTER_ORDER.length-1)goChapter(CHAPTER_ORDER[i+1]);
  if(e.key==='ArrowLeft'&&i>0)goChapter(CHAPTER_ORDER[i-1]);
});

// ============ INIT ============
render('home');
</script>
</body>
</html>
